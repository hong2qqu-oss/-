# FRED 데이터 미러 — 보고서 파이프라인의 데이터 공급자
# 클라우드 에이전트 샌드박스와 데이터센터 IP는 fred.stlouisfed.org(웹)에서 차단되지만,
# FRED 공식 API(api.stlouisfed.org)는 키가 있으면 어디서든 작동한다.
# 평일 23:05 KST(14:05 UTC)에 47개 시리즈를 reports/data/*.csv로 커밋 →
# 23:30 클라우드 루틴이 외부 접속 없이 저장소 파일만 읽어 보고서 작성.
# 필요 시크릿: FRED_API_KEY (Settings → Secrets and variables → Actions)
name: FRED data mirror
on:
  schedule:
    - cron: '5 14 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED series
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -e
          if [ -z "$FRED_API_KEY" ]; then
            echo "::error::FRED_API_KEY 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions에서 추가하세요."
            exit 1
          fi
          mkdir -p reports/data
          SERIES="PAYEMS USPRIV USGOVT USGOOD SRVPRD MANEMP USCONS USMINE USEHS USLAH USPBS USTRADE USWTRADE USINFO USFIRE USTPU USSERV TEMPHELPS CES9091000001 CES9092000001 CES9093000001 CES6562000101 CES6562400001 CES6054150001 CES4348400001 CES4349300001 CE16OV UNEMPLOY UNRATE U6RATE CIVPART LNS11300060 LNS12300060 NILFWJN LNS12032194 LNS13026638 LNS13023653 LNS13023557 LNS13023569 UEMP27OV LNS12026619 LNS14000012 LNS14000006 LNS14000009 LNS14027662 LNS14027660 AWHAETP AWHI CES0500000003 CES0500000011 ICSA CCSA CPIAUCSL CPILFESL CUSR0000SAH1 CUSR0000SEHA CUSR0000SEHC CUSR0000SA0L2 CUSR0000SACL1E CUSR0000SASLE PCETRIM12M159SFRBDAL T10YIE PPIFIS WPSFD4131 WPSFD49207 WPSFD49116 RSAFS RSFSXMV RRSFS RSXFS PCEPI PCEPILFE PCEDG PCES DPCCRC1M027SBEA CPIUFDSL CUSR0000SAF11 CUSR0000SEFV CPIENGSL CUSR0000SETB01 CUSR0000SEHF01 CUSR0000SETA01 CUSR0000SETA02 CPIAPPSL CUSR0000SAM1 CUSR0000SAM2 CUSR0000SAS4 CUSR0000SETG01 WPSFD49208 WPSFD4111 WPSFD49214 WPSFD49501 WPSFD49502 WPSFD49209 WPSFD4121 WPSFD49213 WPSFD49206 WPSID54 WPSID53 WPSID52 WPSID61 WPSID62 WPSID63 WPSID64 WPS0571 WPS057 WPS101 WPS102 WPS081 WPS061 WPS0221 WPS0122 MRTSSM441USS MRTSSM4541USS MRTSSM722USS MRTSSM445USS MRTSSM447USS MRTSSM444USS MRTSSM448USS MRTSSM442USS MRTSSM443USS MRTSSM451USS PCEND DNRGRC1M027SBEA DFXARC1M027SBEA PCEC96 PSAVERT MICH JTSJOL JTSHIL JTSLDL JTSQUL GDPC1 MFGPHLX FEDFUNDS DGS10 DGS2 MORTGAGE30US DFII10 T10Y2Y BAMLH0A0HYM2 BAMLC0A0CMEY BAMLH0A0HYM2EY THREEFYTP10 PERMIT HOUST HSN1F GCE FGCE FDEFX FNDEFX A091RC1Q027SBEA W006RC1Q027SBEA MTSDS133FMS GFDEGDQ188S WTREGEN A822RY2Q224SBEA PCTR DTWEXBGS BOPGSTB BOPTEXP BOPTIMP BOPGTB BOPSTB IIPUSNETIQ IIPASSEQ IIPLIABQ IIPPORTAQ IIPPORTLQ IIPDIREAMVQ IIPDIRELMVQ IEABC NETEXP GPDIC1 PNFIC1 PRFIC1 CBIC1 Y033RX1Q020SBEA B009RX1Q020SBEA Y001RX1Q020SBEA A679RX1Q020SBEA B935RX1Q020SBEA DGORDER NEWORDER ISRATIO DRTSCILM TCU CPATAX CPROFIT PCEC96 PCE PCESV PCESVC96 DFSARX1Q020SBEA DHUTRX1Q020SBEA DHLCRX1Q020SBEA DSPIC96 TDSP DRCCLACBS REVOLSL TNWBSHNO DRSFRMACBS UMCSENT WALCL RRPONTSYD DEXJPUS DEXKOUS NIKKEI225 IRSTCI01JPM156N IR3TIB01JPM156N IRSTCI01KRM156N IR3TIB01KRM156N IRLTLT01KRM156N IRLTLT01JPM156N XTEXVA01JPM667S XTIMVA01JPM667S XTNTVA01JPM667S XTEXVA01KRM667S XTIMVA01KRM667S LRUN64TTJPM156S LRUNTTTTKRM156S LREM64TTJPM156S LREM64TTKRM156S JPNGDPRQPSMEI KORGDPRQPSMEI JPNASSETS LNS11300060 LNS12300060 U6RATE NILFWJN EXHOSLUSM495S HOSSUPUSM673N MSPUS CSUSHPINSA PI M2SL BOGMBASE USALOLITOAASTSAM GPDI PNFI PRFI CBI Y033RC1Q027SBEA B009RC1Q027SBEA Y001RC1Q027SBEA A679RC1Q027SBEA B935RC1Q027SBEA SLCE ADPMNUSNERSA ADPWNUSNERSA ADPMINDCONNERSA ADPMINDMANNERSA ADPMINDTTUNERSA ADPMINDFINNERSA ADPMINDPROBUSNERSA ADPMINDINFONERSA"
          fail=0
          for id in $SERIES; do
            url="https://api.stlouisfed.org/fred/series/observations?series_id=${id}&api_key=${FRED_API_KEY}&file_type=json&sort_order=asc"
            if curl -sf "$url" | jq -r '.observations[] | select(.value != ".") | .date + "," + .value' > "reports/data/${id}.csv.tmp"; then
              if [ -s "reports/data/${id}.csv.tmp" ]; then
                mv "reports/data/${id}.csv.tmp" "reports/data/${id}.csv"
              else
                echo "::warning::${id}: 빈 응답 — 기존 파일 유지"
                rm -f "reports/data/${id}.csv.tmp"
              fi
            else
              echo "::warning::${id}: 수집 실패 — 기존 파일 유지"
              rm -f "reports/data/${id}.csv.tmp"
              fail=$((fail+1))
            fi
            sleep 0.6   # FRED API 속도 제한(120/분) 여유
          done
          date -u +"%Y-%m-%dT%H:%M:%SZ" > reports/data/_mirror_time.txt
          echo "FRED 완료 (실패 ${fail}건)"
      - name: Fetch Yahoo prices
        run: |
          # corsproxy 종료로 사이트가 미러를 읽음 — 주간 종가, 심볼은 영숫자화해 저장
          YAHOO="JPY=X ^VIX ^SKEW MTUM SPY DBMF ES=F NQ=F GC=F SI=F HG=F CL=F 6E=F 6J=F ZT=F ZN=F ZB=F BTC-USD ^KS11"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"
          for sym in $YAHOO; do
            san=$(echo "$sym" | tr -cd 'A-Za-z0-9')
            enc=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$sym")
            url="https://query1.finance.yahoo.com/v8/finance/chart/${enc}?interval=1wk&range=max"
            if curl -sf -A "$UA" "$url" | python3 -c "
          import json,sys
          j=json.load(sys.stdin)
          r=j['chart']['result'][0]
          ts=r.get('timestamp',[]); cl=r['indicators']['quote'][0].get('close',[])
          import datetime
          for t,c in zip(ts,cl):
              if c is not None:
                  print(datetime.datetime.utcfromtimestamp(t).strftime('%Y-%m-%d')+','+format(c,'.4f'))
          " > "reports/data/yahoo_${san}.csv.tmp" && [ -s "reports/data/yahoo_${san}.csv.tmp" ]; then
              mv "reports/data/yahoo_${san}.csv.tmp" "reports/data/yahoo_${san}.csv"
            else
              echo "::warning::yahoo ${sym}: 수집 실패 — 기존 파일 유지"
              rm -f "reports/data/yahoo_${san}.csv.tmp"
            fi
            sleep 1
          done
      - name: Fetch ECOS series
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          if [ -z "$ECOS_API_KEY" ]; then
            echo "::warning::ECOS_API_KEY 시크릿 없음 — 한국 ECOS 시리즈 미러 생략 (Settings→Secrets에 추가하면 활성화)"
            exit 0
          fi
          # 형식: 통계표;항목;주기. 파일명은 항목의 비영숫자를 _로 (*AA → _AA)
          ECOS="722Y001;0101000;M 901Y009;0;M 901Y010;QB;M 404Y014;*AA;M 301Y013;000000;M 511Y002;FME;M 403Y001;309112AA;M 151Y001;1100000;Q 200Y102;10111;Q 200Y102;10122;Q 200Y102;10128;Q 200Y102;10123;Q 200Y102;10124;Q 817Y002;010210000;D"
          TODAY=$(date -u +%Y%m%d)
          for spec in $ECOS; do
            IFS=';' read -r stat item cyc <<< "$spec"
            case "$cyc" in
              D) start="19950101"; end="$TODAY";;
              Q) start="1960Q1";   end="$(date -u +%Y)Q4";;
              *) start="196001";   end="$(date -u +%Y%m)";;
            esac
            san=${item//[^A-Za-z0-9]/_}
            url="https://ecos.bok.or.kr/api/StatisticSearch/${ECOS_API_KEY}/json/kr/1/10000/${stat}/${cyc}/${start}/${end}/${item}"
            if curl -sf "$url" | python3 -c "
          import json,sys
          j=json.load(sys.stdin)
          if 'RESULT' in j: sys.exit(1)
          rows=j.get('StatisticSearch',{}).get('row',[])
          seen=set()
          out=[]
          for r in rows:
              t=str(r['TIME']); c='$cyc'
              if c=='D': iso=f'{t[0:4]}-{t[4:6]}-{t[6:8]}'
              elif c=='Q':
                  import re; d=re.sub(r'\\D','',t); q=int(d[4:]) if len(d)>4 else 1
                  iso=f'{t[0:4]}-{(q-1)*3+1:02d}-01'
              else: iso=f'{t[0:4]}-{t[4:6]}-01'
              try: v=float(r['DATA_VALUE'])
              except: continue
              if iso in seen: continue
              seen.add(iso); out.append((iso,v))
          out.sort()
          for iso,v in out: print(f'{iso},{v}')
          " > "reports/data/ecos_${stat}_${san}.csv.tmp" && [ -s "reports/data/ecos_${stat}_${san}.csv.tmp" ]; then
              mv "reports/data/ecos_${stat}_${san}.csv.tmp" "reports/data/ecos_${stat}_${san}.csv"
            else
              echo "::warning::ecos ${stat}/${item}: 수집 실패 — 기존 파일 유지"
              rm -f "reports/data/ecos_${stat}_${san}.csv.tmp"
            fi
            sleep 0.5
          done
      - name: Commit if changed
        run: |
          git config user.name "fred-mirror-bot"
          git config user.email "actions@github.com"
          git add reports/data
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 미러: $(date -u +%Y-%m-%d) FRED $(ls reports/data/*.csv | wc -l)종"
            git push
          fi
