<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경제레이더 · 민홍</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --sidebar-bg: #161b22;
      --panel-bg: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --active-bg: #1f3a5f;
      --category-color: #7ee787;
      --red: #f85149;
      --yellow: #e3b341;
      --sidebar-width: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    #sidebar-header p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .category-label {
      padding: 10px 14px 4px;
      font-size: 9px;
      font-weight: 700;
      color: var(--category-color);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .indicator-item {
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .indicator-item:hover { background: rgba(88,166,255,0.06); }
    .indicator-item.active { background: var(--active-bg); }
    .indicator-item.overlaid { background: rgba(127,231,135,0.07); }

    .overlay-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 11px;
      width: 18px; height: 18px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .indicator-item:hover .overlay-btn { display: flex; }
    .overlay-btn:hover { border-color: var(--category-color); color: var(--category-color); }
    .overlay-btn.active-overlay { display: flex; border-color: var(--category-color); color: var(--category-color); background: rgba(127,231,135,0.15); }

    #overlay-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .overlay-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px 2px 8px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .overlay-chip-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .overlay-chip-x {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0 0 0 2px;
    }
    .overlay-chip-x:hover { color: var(--red); }

    .indicator-item .name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .indicator-item .meta {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .indicator-item .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      margin-left: 8px;
      transition: background 0.3s;
    }

    .indicator-item .status-dot.loaded { background: var(--category-color); }
    .indicator-item .status-dot.loading { background: var(--yellow); }
    .indicator-item .status-dot.error { background: var(--red); }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sidebar-bg);
      flex-shrink: 0;
    }

    #chart-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #chart-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .range-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .range-btn:hover { border-color: var(--accent); color: var(--accent); }
    .range-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    #chart-area {
      flex: 1;
      padding: 20px 24px;
      overflow: hidden;
      position: relative;
    }

    #chart-wrapper {
      width: 100%;
      height: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
    }

    #myChart { width: 100% !important; height: 100% !important; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(28,33,40,0.85);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      gap: 10px;
      z-index: 10;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #legend-area {
      padding: 10px 24px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
      background: var(--sidebar-bg);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .legend-color {
      width: 20px;
      height: 2px;
      border-radius: 1px;
    }

    #latest-value {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    #latest-value span {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
    }

    #error-msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      background: rgba(28,33,40,0.85);
      border-radius: 10px;
      z-index: 10;
    }

    #error-msg .err-icon { font-size: 32px; }
    #error-msg .err-text { font-size: 13px; color: var(--text-muted); }
    #error-msg .err-detail { font-size: 11px; color: var(--red); max-width: 400px; text-align: center; }

    /* API Key설정 모달 */
    #api-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #api-modal.show { display: flex; }

    #api-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      width: 420px;
    }

    #api-box h2 { font-size: 16px; margin-bottom: 6px; }
    #api-box p { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

    #api-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      margin-bottom: 12px;
    }

    #api-box button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 9px;
      color: #0d1117;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .api-setting-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .api-setting-btn:hover { color: var(--text); }

    #country-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .country-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .country-btn.active {
      background: var(--active-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .country-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .country-btn:not(.disabled):hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    #stat-boxes {
      display: none;
      gap: 8px;
      align-items: center;
    }

    .stat-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 14px;
      text-align: center;
      min-width: 90px;
    }

    .stat-box-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-box-val {
      font-size: 15px;
      font-weight: 700;
      margin-top: 1px;
    }

    .stat-pos { color: #7ee787; }
    .stat-neg { color: #f85149; }
    .stat-neutral { color: var(--text-muted); }

    .stat-box {
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .stat-box:hover { border-color: var(--accent); }
    .stat-box.active {
      border-color: var(--accent);
      background: var(--active-bg);
    }
    .stat-box.active .stat-box-label { color: var(--accent); }

    #yrange-bar {
      display: none;
      gap: 6px;
      align-items: center;
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
    }
    .yrange-input {
      width: 64px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 7px;
      color: var(--text);
      font-size: 11px;
      text-align: center;
    }
    .yrange-input:focus { outline: none; border-color: var(--accent); }
    #reset-zoom-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
    }
    #reset-zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h1>경제레이더 · 민홍</h1>
    <p id="last-updated">데이터 로딩 전</p>
  </div>
  <div id="country-tabs">
    <button class="country-btn active" data-country="US">🇺🇸 US</button>
    <button class="country-btn" data-country="KR">🇰🇷 KR</button>
    <button class="country-btn" data-country="JP">🇯🇵 JP</button>
    <button class="country-btn disabled" data-country="EU" title="준비 중">🇪🇺 EU</button>
  </div>
  <div id="sidebar-scroll" id="indicator-list"></div>
</nav>

<!-- Main -->
<main id="main">
  <div id="topbar">
    <div>
      <div id="chart-title">지표를 선택하세요</div>
      <div id="chart-subtitle">—</div>
    </div>
    <div id="stat-boxes">
      <div class="stat-box">
        <div class="stat-box-label">YoY</div>
        <div class="stat-box-val stat-neutral" id="stat-yoy-val">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">MoM</div>
        <div class="stat-box-val stat-neutral" id="stat-mom-val">—</div>
      </div>
    </div>
    <div id="controls">
      <button class="range-btn" data-years="5">5Y</button>
      <button class="range-btn active" data-years="10">10Y</button>
      <button class="range-btn" data-years="20">20Y</button>
      <button class="range-btn" data-years="0">All</button>
      <button class="api-setting-btn" id="api-btn">⚙ API Key</button>
    </div>
  </div>

  <div id="chart-area">
    <div id="chart-wrapper">
      <canvas id="myChart"></canvas>
      <div id="loading-overlay"><div class="spinner"></div> 데이터 불러오는 중...</div>
      <div id="error-msg">
        <div class="err-icon">⚠</div>
        <div class="err-text">데이터를 불러올 수 없습니다</div>
        <div class="err-detail" id="err-detail-text"></div>
      </div>
    </div>
  </div>

  <div id="legend-area">
    <div class="legend-item"><div class="legend-color" style="background:#58a6ff"></div> Raw</div>
    <div class="legend-item"><div class="legend-color" style="background:#ff7b72;opacity:0.9"></div> MA3</div>
    <div class="legend-item"><div class="legend-color" style="background:#ffa657;opacity:0.9"></div> MA6</div>
    <div class="legend-item"><div class="legend-color" style="background:#7ee787;opacity:0.9"></div> MA12</div>
    <div class="legend-item"><div class="legend-color" style="background:#d2a8ff;opacity:0.9"></div> MA24</div>
    <div class="legend-item"><div class="legend-color" style="background:#e3b341;opacity:0.9"></div> MA60</div>
    <div id="overlay-chips"></div>
    <button id="reset-zoom-btn">↺ Reset</button>
    <div id="yrange-bar">
      Y축: <input class="yrange-input" id="ymin-input" placeholder="Min" />
      ~ <input class="yrange-input" id="ymax-input" placeholder="Max" />
    </div>
    <div id="latest-value">최신값: <span id="latest-val-num">—</span></div>
  </div>
</main>

<!-- API Key 모달 -->
<div id="api-modal">
  <div id="api-box">
    <h2>FRED API Key 설정</h2>
    <p>St. Louis Fed FRED API 키를 입력하세요.<br>
       <a href="https://fred.stlouisfed.org/docs/api/api_key.html" target="_blank" style="color:var(--accent)">발급 링크 (무료)</a>
    </p>
    <input type="text" id="api-key-input" placeholder="예: 5b4992d3d01f61fd0f0be3ade5328568" />
    <button id="save-api-btn">저장</button>
  </div>
</div>

<script>
// ─── INDICATORS CONFIG ───────────────────────────────────────────────────────
const INDICATORS = [
  // 물가
  { id:'CPIAUCSL',    name:'CPI (전체)',            unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'CPILFESL',    name:'Core CPI',              unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'PCEPI',       name:'PCE 물가지수',           unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'PCEPILFE',    name:'Core PCE',              unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'PPIACO',      name:'PPI (전체)',             unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'WPSFD4131',   name:'Core PPI',              unit:'% YoY', category:'물가 / INFLATION', transform:'yoy' },
  { id:'MICH',        name:'미시간 기대 인플레',      unit:'%',     category:'물가 / INFLATION' },

  // 고용
  { id:'UNRATE',      name:'실업률',                unit:'%',     category:'고용 / EMPLOYMENT' },
  { id:'PAYEMS',      name:'비농업 고용',            unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'CIVPART',     name:'경제활동참가율',          unit:'%',     category:'고용 / EMPLOYMENT' },
  { id:'ICSA',        name:'신규 실업수당 청구',      unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'CCSA',        name:'연속 실업수당 청구',      unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'JTSJOL',      name:'JOLTS 구인건수',         unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'JTSHIL',      name:'JOLTS 고용건수',         unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'JTSLDL',      name:'JOLTS 해고건수',         unit:'K',     category:'고용 / EMPLOYMENT' },
  { id:'JTSQUL',      name:'JOLTS 퇴직건수',         unit:'K',     category:'고용 / EMPLOYMENT' },

  // 성장
  { id:'GDPC1',       name:'실질 GDP',              unit:'% YoY', category:'성장 / GROWTH', transform:'yoy' },
  { id:'BOPCA',       name:'경상수지',               unit:'B$',    category:'성장 / GROWTH' },

  // PMI
  { id:'MFGPHLX',     name:'필라델피아 제조업 서베이', unit:'Index', category:'PMI',              country:'US' },

  // 금리 & 스프레드
  { id:'FEDFUNDS',    name:'기준금리 (FFR)',          unit:'%',     category:'금리 & 스프레드',  country:'US' },
  { id:'DGS10',       name:'10년물 국채금리',         unit:'%',     category:'금리 & 스프레드',  country:'US', freq:'w', noStats:true },
  { id:'DGS2',        name:'2년물 국채금리',          unit:'%',     category:'금리 & 스프레드',  country:'US', freq:'w', noStats:true },
  { id:'MORTGAGE30US',name:'30년 모기지 금리',        unit:'%',     category:'금리 & 스프레드',  country:'US' },
  { id:'T10Y2Y',      name:'장단기 스프레드 (10Y-2Y)',unit:'%p',    category:'금리 & 스프레드',  country:'US', freq:'m' },
  { id:'BAMLH0A0HYM2',name:'하이일드 스프레드',       unit:'%p',    category:'금리 & 스프레드',  country:'US', freq:'m' },

  // 주택
  { id:'HOUST',       name:'주택착공건수',            unit:'K',     category:'주택 / HOUSING',   country:'US' },

  // 소비
  { id:'RSAFS',       name:'소매판매',               unit:'% YoY', category:'소비 / CONSUMER',  country:'US', transform:'yoy' },
  { id:'UMCSENT',     name:'미시간 소비자심리',        unit:'Index', category:'소비 / CONSUMER',  country:'US' },
  { id:'PCE',         name:'개인소비지출 (PCE)',      unit:'% YoY', category:'소비 / CONSUMER',  country:'US', transform:'yoy' },

  // 통화
  { id:'M2SL',        name:'M2 통화량',              unit:'B$',    category:'통화 / MONEY SUPPLY', country:'US' },
  { id:'BOGMBASE',    name:'본원통화',               unit:'M$',    category:'통화 / MONEY SUPPLY', country:'US' },

  // 국제
  { id:'DTWEXBGS',    name:'달러 인덱스 (무역가중)',   unit:'Index', category:'국제 / INTERNATIONAL', country:'US' },

  // 경기선행
  { id:'USALOLITOAASTSAM', name:'경기선행지수 (OECD CLI)', unit:'Index', category:'경기선행 / LEI', country:'US' },

  // 기타 고빈도
  { id:'TSA_CHECKPOINT', name:'TSA 공항 검색대 (일간)', unit:'명',  category:'기타 / OTHER', country:'US', source:'tsa' },

  // ── 🇰🇷 KOREA ──────────────────────────────────────────────────────────────

// ─── TRANSFORMS ──────────────────────────────────────────────────────────────
function calcMoM(data) {
  return data.map((pt, i) => {
    if (i === 0) return { x: pt.x, y: null };
    const prev = data[i - 1];
    if (!prev || prev.y === null || prev.y === 0) return { x: pt.x, y: null };
    return { x: pt.x, y: +((pt.y - prev.y) / Math.abs(prev.y) * 100).toFixed(2) };
  }).filter(pt => pt.y !== null);
}

function applyTransform(raw, mode) {
  if (mode === 'yoy') return calcYoY(raw);
  if (mode === 'mom') return calcMoM(raw);
  return raw;
}

function defaultMode(ind) {
  return ind.transform === 'yoy' ? 'yoy' : 'raw';
}

// ─── YOY TRANSFORM ───────────────────────────────────────────────────────────
function calcYoY(data) {
  return data.map(pt => {
    const d = new Date(pt.x);
    const prevYear = d.getFullYear() - 1;
    const prevMonth = d.getMonth();
    const prev = data.find(p => {
      const pd = new Date(p.x);
      return pd.getFullYear() === prevYear && pd.getMonth() === prevMonth;
    });
    if (!prev) return { x: pt.x, y: null };
    return { x: pt.x, y: +((pt.y - prev.y) / prev.y * 100).toFixed(2) };
  }).filter(pt => pt.y !== null);
}

// ─── STATS (YoY / MoM) ───────────────────────────────────────────────────────
function calcStats(rawData, ind) {
  if (!rawData || rawData.length < 2) return null;
  const latest = rawData[rawData.length - 1];

  if (ind.transform === 'yoy') {
    const yoyData = calcYoY(rawData);
    if (yoyData.length < 2) return null;
    const last = yoyData[yoyData.length - 1];
    const prev = yoyData[yoyData.length - 2];
    return {
      yoy: { val: last.y, suffix: '%', label: 'YoY' },
      mom: { val: +(last.y - prev.y).toFixed(2), suffix: 'pp', label: 'MoM Δ' },
    };
  }

  // Raw stats: find prev month & prev year
  const latestDate = new Date(latest.x);
  const prevMonthDate = new Date(latestDate);
  prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
  const prevMonthStr = prevMonthDate.toISOString().slice(0, 7);
  const prevYearDate = new Date(latestDate);
  prevYearDate.setFullYear(prevYearDate.getFullYear() - 1);
  const prevYearStr = prevYearDate.toISOString().slice(0, 7);

  const prevMonth = [...rawData].reverse().find(p => p.x.slice(0, 7) === prevMonthStr)
    || [...rawData].reverse().find(p => p.x.slice(0, 7) <= prevMonthStr);
  const prevYear  = [...rawData].reverse().find(p => p.x.slice(0, 7) === prevYearStr)
    || [...rawData].reverse().find(p => p.x.slice(0, 7) <= prevYearStr);

  const pct = (a, b) => b ? +((a - b) / Math.abs(b) * 100).toFixed(2) : null;
  return {
    yoy: prevYear  ? { val: pct(latest.y, prevYear.y),  suffix: '%', label: 'YoY' } : null,
    mom: prevMonth ? { val: pct(latest.y, prevMonth.y), suffix: '%', label: 'MoM' } : null,
  };
}

function renderStatBoxes(stats, ind) {
  const el = document.getElementById('stat-boxes');
  if (!stats || ind.noStats) { el.style.display = 'none'; return; }

  const fmt = (s) => {
    if (!s || s.val === null) return { text: '—', cls: 'stat-neutral' };
    const sign = s.val > 0 ? '+' : '';
    return { text: `${sign}${s.val}${s.suffix}`, cls: s.val > 0 ? 'stat-pos' : (s.val < 0 ? 'stat-neg' : 'stat-neutral') };
  };

  const yoyLabel = ind.transform === 'yoy' ? 'YoY ▸ Chart' : 'YoY ▸ Chart';
  const momLabel = ind.transform === 'yoy' ? 'MoM Δ ▸ Chart' : 'MoM ▸ Chart';
  document.querySelector('.stat-box:nth-child(1) .stat-box-label').textContent = yoyLabel;
  document.querySelector('.stat-box:nth-child(2) .stat-box-label').textContent = momLabel;

  const yoyFmt = fmt(stats.yoy);
  const momFmt = fmt(stats.mom);
  const yoyEl = document.getElementById('stat-yoy-val');
  const momEl = document.getElementById('stat-mom-val');
  yoyEl.textContent = yoyFmt.text;
  yoyEl.className = `stat-box-val ${yoyFmt.cls}`;
  momEl.textContent = momFmt.text;
  momEl.className = `stat-box-val ${momFmt.cls}`;

  // Highlight active mode
  document.querySelectorAll('.stat-box').forEach(b => b.classList.remove('active'));
  if (currentMode === 'yoy') document.querySelector('.stat-box:nth-child(1)').classList.add('active');
  if (currentMode === 'mom') document.querySelector('.stat-box:nth-child(2)').classList.add('active');

  el.style.display = 'flex';
}

function switchMode(newMode) {
  if (!currentIndicator || !currentRawData) return;
  currentMode = (currentMode === newMode) ? defaultMode(currentIndicator) : newMode;
  const unitSuffix = currentMode === 'yoy' ? '% YoY' : currentMode === 'mom' ? '% MoM' : currentIndicator.unit;
  const displayInd = { ...currentIndicator, unit: unitSuffix };
  renderChart(applyTransform(currentRawData, currentMode), displayInd);
  renderStatBoxes(calcStats(currentRawData, currentIndicator), currentIndicator);
  latestValEl.textContent = (() => {
    const d = applyTransform(currentRawData, currentMode);
    const last = d[d.length - 1];
    return last ? `${last.y.toLocaleString()} ${unitSuffix} (${last.x})` : '—';
  })();
}

// ─── MOVING AVERAGE ───────────────────────────────────────────────────────────
function calcMA(data, period) {
  return data.map((pt, i) => {
    if (i < period - 1) return { x: pt.x, y: null };
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].y;
    return { x: pt.x, y: +(sum / period).toFixed(4) };
  });
}

// ─── FETCH: TSA CHECKPOINT ───────────────────────────────────────────────────
async function fetchTSA() {
  if (cache['TSA']) return cache['TSA'];

  // TSA HTML 파싱 헬퍼
  // 각 행: "날짜 현재연도값 [전년값 전전년값 ...]"
  // colYears: col0(날짜 제외 첫째)부터 각 열이 어떤 연도인지
  const parseHTML = (html, colYears) => {
    const rows = (html.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi) || [])
      .map(r => r.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim())
      .filter(r => /^\d+\/\d+\/\d{4}/.test(r));
    const pts = {};
    for (const row of rows) {
      const parts = row.split(/\s+/);
      const [m, d, baseYear] = parts[0].split('/').map(Number);
      colYears.forEach((yr, i) => {
        const raw = parts[i + 1]?.replace(/,/g, '');
        const val = parseFloat(raw);
        if (!isNaN(val) && val > 0) {
          // Feb 29 → 비윤년이면 Feb 28로 대체
          let day = d;
          if (m === 2 && d === 29) {
            const isLeap = yr % 4 === 0 && (yr % 100 !== 0 || yr % 400 === 0);
            if (!isLeap) day = 28;
          }
          const key = `${yr}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          if (!pts[key]) pts[key] = val; // 먼저 온 게 우선
        }
      });
    }
    return pts;
  };

  const proxy = u => `https://corsproxy.io/?${encodeURIComponent(u)}`;
  const TSA_URL = 'https://www.tsa.gov/travel/passenger-volumes';
  const SNAP_2023 = 'https://web.archive.org/web/20230101185405/' + TSA_URL;
  // Wayback CDX로 2025 스냅샷 URL 동적 조회
  const snap2025Res = await fetch('https://archive.org/wayback/available?url=tsa.gov/travel/passenger-volumes&timestamp=20250101')
    .then(r => r.json()).catch(() => null);
  const SNAP_2025 = snap2025Res?.archived_snapshots?.closest?.url
    || 'https://web.archive.org/web/20250101000000/' + TSA_URL;

  const [html2023, html2025, htmlNow] = await Promise.all([
    fetch(proxy(SNAP_2023)).then(r => r.text()),
    fetch(proxy(SNAP_2025)).then(r => r.text()),
    fetch(proxy(TSA_URL)).then(r => r.text()),
  ]);

  const currentYear = new Date().getFullYear();
  const all = {
    ...parseHTML(html2023, [2022, 2021, 2020, 2019]),
    ...parseHTML(html2025, [2024, 2023]),
    ...parseHTML(htmlNow,  [currentYear]),
  };

  const points = Object.entries(all)
    .map(([x, y]) => ({ x, y }))
    .sort((a, b) => a.x.localeCompare(b.x));

  if (points.length === 0) throw new Error('TSA 데이터를 가져오지 못했습니다.');
  cache['TSA'] = points;
  return points;
}

// ─── FETCH ────────────────────────────────────────────────────────────────────
async function fetchFRED(seriesId, freq) {
  if (!apiKey) {
    throw new Error('API 키가 없습니다. 우측 상단 ⚙ API Key 버튼에서 입력하세요.');
  }
  const cacheKey = `${seriesId}_${freq||''}`;
  if (cache[cacheKey]) return cache[cacheKey];

  const freqParam = freq ? `&frequency=${freq}&aggregation_method=avg` : '';
  const fredUrl = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${apiKey}&file_type=json&sort_order=asc${freqParam}`;
  const url = `https://corsproxy.io/?${encodeURIComponent(fredUrl)}`;
  let res;
  try {
    res = await fetch(url);
  } catch (netErr) {
    throw new Error('네트워크 오류: 데이터를 불러올 수 없습니다.\n• 인터넷 연결을 확인하세요\n• 잠시 후 다시 시도하세요');
  }
  if (!res.ok) {
    throw new Error(`FRED 서버 오류 (HTTP ${res.status}): 잠시 후 다시 시도하세요.`);
  }
  const json = await res.json();
  if (json.error_message) throw new Error(`FRED API 오류: ${json.error_message}`);

  const points = json.observations
    .filter(o => o.value !== '.' && o.value !== '')
    .map(o => ({ x: o.date, y: parseFloat(o.value) }));

  cache[cacheKey] = points;
  return points;
}

// ─── CHART ────────────────────────────────────────────────────────────────────
function filterByYears(data, years) {
  if (!years) return data;
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - years);
  const cutStr = cutoff.toISOString().slice(0,10);
  return data.filter(p => p.x >= cutStr);
}

function renderChart(allData, ind) {
  const data = filterByYears(allData, currentYears);
  const ma3  = filterByYears(calcMA(allData, 3),  currentYears);
  const ma6  = filterByYears(calcMA(allData, 6),  currentYears);
  const ma12 = filterByYears(calcMA(allData, 12), currentYears);
  const ma24 = filterByYears(calcMA(allData, 24), currentYears);
  const ma60 = filterByYears(calcMA(allData, 60), currentYears);

  const makeLineDS = (label, pts, color, width) => ({
    type: 'line',
    label,
    data: pts,
    borderColor: color,
    borderWidth: width,
    pointRadius: 0,
    tension: 0.3,
    spanGaps: false,
  });

  // 이중 Y축: overlay 중 단위가 다른 게 있으면 y2 사용
  const hasY2 = overlays.some(o => o.ind.unit !== ind.unit);

  const datasets = [
    {
      type: 'bar',
      label: 'Raw',
      data,
      backgroundColor: 'rgba(88,166,255,0.35)',
      borderColor: 'rgba(88,166,255,0.6)',
      borderWidth: 0,
      maxBarThickness: 12,
      barPercentage: 0.9,
      yAxisID: 'y',
    },
    makeLineDS('MA3',  ma3,  '#ff7b72', 1.5),
    makeLineDS('MA6',  ma6,  '#ffa657', 1.5),
    makeLineDS('MA12', ma12, '#7ee787', 2),
    makeLineDS('MA24', ma24, '#d2a8ff', 2),
    makeLineDS('MA60', ma60, '#e3b341', 2.5),
    // overlay 데이터셋 (단순 선, MA 없음)
    ...overlays.map(o => {
      const oData = filterByYears(applyTransform(o.raw, defaultMode(o.ind)), currentYears);
      const sameUnit = o.ind.unit === ind.unit;
      return {
        type: 'line',
        label: o.ind.name,
        data: oData,
        borderColor: o.color,
        borderWidth: 2.5,
        pointRadius: 0,
        tension: 0.3,
        spanGaps: false,
        yAxisID: sameUnit ? 'y' : 'y2',
      };
    }),
  ];

  if (chart) chart.destroy();

  const ctx = document.getElementById('myChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#8b949e',
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y === null) return null;
              return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} ${ind.unit}`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'yyyy-MM-dd' },
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#8b949e', maxTicksLimit: 10, font: { size: 10 } }
        },
        y: (() => { const s = calcSmartYRange(data); return {
          min: getYMin() ?? s.min,
          max: getYMax() ?? s.max,
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v.toLocaleString() },
          title: { display: overlays.length > 0, text: ind.unit, color: '#8b949e', font: { size: 9 } }
        }; })(),
        ...(hasY2 ? { y2: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v.toLocaleString() },
          title: { display: true, text: overlays.filter(o=>o.ind.unit!==ind.unit).map(o=>o.ind.unit).join('/'), color: '#8b949e', font: { size: 9 } }
        }} : {})
      },
      plugins: {
        zoom: {
          zoom: { wheel: { enabled: true, speed: 0.08 }, pinch: { enabled: true }, mode: 'x' },
          pan:  { enabled: true, mode: 'x' },
        }
      }
    }
  });

  // Latest value
  const last = data[data.length - 1];
  if (last) {
    latestValEl.textContent = `${last.y.toLocaleString()} ${ind.unit} (${last.x})`;
  }
}

// ─── OVERLAY ──────────────────────────────────────────────────────────────────
async function toggleOverlay(ind) {
  if (!currentIndicator) return;
  if (ind.id === currentIndicator.id) return; // 현재 주 지표는 overlay 불가

  const existing = overlays.findIndex(o => o.ind.id === ind.id);
  if (existing !== -1) {
    overlays.splice(existing, 1);
  } else {
    const color = OVERLAY_COLORS[overlays.length % OVERLAY_COLORS.length];
    const dot = document.getElementById(`dot-${ind.id}`);
    if (dot) dot.className = 'status-dot loading';
    try {
      const raw = ind.source === 'tsa' ? await fetchTSA() : await fetchFRED(ind.id, ind.freq);
      overlays.push({ ind, raw, color });
      if (dot) dot.className = 'status-dot loaded';
    } catch(e) {
      if (dot) dot.className = 'status-dot error';
      return;
    }
  }
  updateOverlayBtns();
  renderOverlayChips();
  if (currentRawData) {
    const data = applyTransform(currentRawData, currentMode);
    renderChart(data, currentIndicator);
  }
}

function updateOverlayBtns() {
  document.querySelectorAll('.overlay-btn').forEach(btn => {
    const id = btn.id.replace('ovbtn-', '');
    const isOverlaid = overlays.some(o => o.ind.id === id);
    btn.classList.toggle('active-overlay', isOverlaid);
    btn.textContent = isOverlaid ? '✕' : '＋';
    const item = btn.closest('.indicator-item');
    if (item) item.classList.toggle('overlaid', isOverlaid);
  });
}

function renderOverlayChips() {
  const el = document.getElementById('overlay-chips');
  el.innerHTML = overlays.map(o => `
    <div class="overlay-chip">
      <div class="overlay-chip-dot" style="background:${o.color}"></div>
      <span>${o.ind.name}</span>
      <button class="overlay-chip-x" data-id="${o.ind.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.overlay-chip-x').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      overlays = overlays.filter(o => o.ind.id !== id);
      updateOverlayBtns();
      renderOverlayChips();
      if (currentRawData) renderChart(applyTransform(currentRawData, currentMode), currentIndicator);
    });
  });
}

// ─── SELECT INDICATOR ─────────────────────────────────────────────────────────
async function selectIndicator(ind) {
  currentIndicator = ind;

  // Sidebar active
  document.querySelectorAll('.indicator-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.indicator-item[data-id="${ind.id}"]`);
  if (activeEl) activeEl.classList.add('active');

  // Header
  chartTitle.textContent = ind.name;
  chartSubtitle.textContent = `${ind.id} · ${ind.unit} · Source: FRED`;

  // Show loading
  loadingEl.style.display = 'flex';
  errorEl.style.display = 'none';

  const dot = document.getElementById(`dot-${ind.id}`);
  if (dot) { dot.className = 'status-dot loading'; }

  try {
    const raw = ind.source === 'tsa' ? await fetchTSA() : await fetchFRED(ind.id, ind.freq);
    currentRawData = raw;
    currentMode = defaultMode(ind);
    const data = applyTransform(raw, currentMode);
    renderChart(data, ind);
    renderStatBoxes(calcStats(raw, ind), ind);
    // Reset y-range inputs on new indicator
    document.getElementById('ymin-input').value = '';
    document.getElementById('ymax-input').value = '';
    showYRangeBar();
    loadingEl.style.display = 'none';
    if (dot) dot.className = 'status-dot loaded';
    lastUpdatedEl.textContent = `업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;
  } catch (err) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
    errDetailEl.textContent = err.message;
    if (dot) dot.className = 'status-dot error';
    console.error(err);
  }
}

  btn.addEventListener('click', () => {

document.querySelector('.stat-box:nth-child(1)').addEventListener('click', () => switchMode('yoy'));
document.querySelector('.stat-box:nth-child(2)').addEventListener('click', () => switchMode('mom'));

// ─── SMART Y RANGE ────────────────────────────────────────────────────────────
function calcSmartYRange(data) {
  const vals = data.filter(p => p.y !== null && !isNaN(p.y)).map(p => p.y);
  if (vals.length === 0) return { min: undefined, max: undefined };
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min;
  if (range === 0) return { min: undefined, max: undefined };
  // 데이터가 양수이고 범위가 좁게 뭉쳐 있을 때 (경제활동참가율 등)
  if (min > 0 && min > max * 0.55 && range / max < 0.3) {
    const pad = range * 0.6;
    return { min: Math.max(0, +(min - pad).toFixed(2)), max: +(max + pad).toFixed(2) };
  }
  return { min: undefined, max: undefined };
}

// ─── Y AXIS RANGE ─────────────────────────────────────────────────────────────
function getYMin() {
  const v = parseFloat(document.getElementById('ymin-input')?.value);
  return isNaN(v) ? undefined : v;
}
function getYMax() {
  const v = parseFloat(document.getElementById('ymax-input')?.value);
  return isNaN(v) ? undefined : v;
}

['ymin-input', 'ymax-input'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => {
    if (chart) {
      chart.options.scales.y.min = getYMin();
      chart.options.scales.y.max = getYMax();
      chart.update();
    }
  });
});

document.getElementById('ymin-input').addEventListener('focus', () => {
  document.getElementById('yrange-bar').style.display = 'flex';
});

// Y range bar show when chart loaded
function showYRangeBar() {
  document.getElementById('yrange-bar').style.display = 'flex';
}

// ─── LEGEND COLOR/THICKNESS PICKER ───────────────────────────────────────────
const CHART_DS_LABELS = ['Raw', 'MA3', 'MA6', 'MA12', 'MA24', 'MA60'];

(function setupColorPicker() {
  // 피커 팝업 생성
  const picker = document.createElement('div');
  picker.id = 'color-picker-popup';
  picker.style.cssText = `
    display:none; position:fixed; z-index:200;
    background:var(--panel-bg); border:1px solid var(--border);
    border-radius:10px; padding:12px 14px; min-width:160px;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  `;
  picker.innerHTML = `
    <div style="font-size:10px;color:var(--text-muted);margin-bottom:8px">색상 / 굵기</div>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
      <input type="color" id="pc-color" style="width:32px;height:28px;border:none;border-radius:4px;cursor:pointer;background:none">
      <span id="pc-label" style="font-size:11px;color:var(--text)">—</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:10px;color:var(--text-muted)">굵기</span>
      <input type="range" id="pc-width" min="0.5" max="5" step="0.5" style="flex:1;accent-color:var(--accent)">
      <span id="pc-width-val" style="font-size:10px;color:var(--text-muted);min-width:24px">2</span>
    </div>
  `;
  document.body.appendChild(picker);

  let targetDsIndex = -1;
  let targetIsOverlay = false;
  let targetOverlayId = null;

  function openPicker(e, label, color, width, dsIndex, isOverlay, overlayId) {
    targetDsIndex = dsIndex;
    targetIsOverlay = isOverlay;
    targetOverlayId = overlayId;
    document.getElementById('pc-label').textContent = label;
    document.getElementById('pc-color').value = color || '#ffffff';
    document.getElementById('pc-width').value = width || 2;
    document.getElementById('pc-width-val').textContent = width || 2;
    const rect = e.target.getBoundingClientRect();
    picker.style.left = Math.min(rect.left, window.innerWidth - 180) + 'px';
    picker.style.top = (rect.bottom + 6) + 'px';
    picker.style.display = 'block';
    e.stopPropagation();
  }

  document.getElementById('pc-color').addEventListener('input', () => {
    const color = document.getElementById('pc-color').value;
    applyPickerChange(color, null);
  });
  document.getElementById('pc-width').addEventListener('input', () => {
    const w = parseFloat(document.getElementById('pc-width').value);
    document.getElementById('pc-width-val').textContent = w;
    applyPickerChange(null, w);
  });

  function applyPickerChange(color, width) {
    if (!chart) return;
    if (targetIsOverlay) {
      const ov = overlays.find(o => o.ind.id === targetOverlayId);
      if (ov) {
        if (color) ov.color = color;
        const ds = chart.data.datasets.find(d => d.label === ov.ind.name);
        if (ds) { if (color) ds.borderColor = color; if (width) ds.borderWidth = width; }
      }
    } else if (targetDsIndex >= 0) {
      const ds = chart.data.datasets[targetDsIndex];
      if (!ds) return;
      if (targetDsIndex === 0) { // Raw bar
        if (color) { ds.backgroundColor = color + '55'; ds.borderColor = color; }
      } else {
        if (color) ds.borderColor = color;
        if (width) ds.borderWidth = width;
      }
    }
    chart.update('none');
    renderOverlayChips();
  }

  // 범례 아이템 더블클릭
  document.querySelectorAll('.legend-item').forEach((item, i) => {
    const dot = item.querySelector('.legend-color');
    if (!dot) return;
    dot.style.cursor = 'pointer';
    dot.title = '더블클릭: 색상/굵기 변경';
    dot.addEventListener('dblclick', e => {
      const ds = chart?.data?.datasets?.[i];
      if (!ds) return;
      const color = ds.borderColor || '#ffffff';
      const width = ds.borderWidth || 2;
      openPicker(e, CHART_DS_LABELS[i] || ds.label, color, width, i, false, null);
    });
  });

  // overlay chip 색상 더블클릭 (동적이므로 event delegation)
  document.getElementById('overlay-chips').addEventListener('dblclick', e => {
    const dot = e.target.closest('.overlay-chip-dot');
    if (!dot) return;
    const chip = dot.closest('.overlay-chip');
    const xBtn = chip?.querySelector('.overlay-chip-x');
    if (!xBtn) return;
    const id = xBtn.dataset.id;
    const ov = overlays.find(o => o.ind.id === id);
    if (!ov) return;
    const ds = chart?.data?.datasets?.find(d => d.label === ov.ind.name);
    openPicker(e, ov.ind.name, ov.color, ds?.borderWidth || 2.5, -1, true, id);
  });

  // 바깥 클릭 시 닫기
  document.addEventListener('click', e => {
    if (!picker.contains(e.target)) picker.style.display = 'none';
  });
})();

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildSidebar();
loadingEl.style.display = 'none';

if (!apiKey) {
  apiModal.classList.add('show');
} else {
  selectIndicator(INDICATORS[0]);
}
</script>
