<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MacroLens — 경제지표 대시보드</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary:   #131722;
      --bg-secondary: #1e222d;
      --bg-hover:     #2a2e39;
      --border:       #2a2e39;
      --text-primary: #d1d4dc;
      --text-muted:   #787b86;
      --text-dim:     #4c525e;
      --accent:       #2196f3;
      --accent-hover: #1976d2;
      --green:        #26a69a;
      --red:          #ef5350;
    }

    html, body {
      height: 100%;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── LAYOUT ───────────────────────────── */
    .app { display: flex; flex-direction: column; height: 100vh; }

    /* ── HEADER ───────────────────────────── */
    .header {
      height: 48px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .logo {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--accent);
      white-space: nowrap;
    }
    .logo span { color: var(--text-primary); }
    .hdiv { width: 1px; height: 22px; background: var(--border); }
    .api-row { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .api-label { color: var(--text-muted); font-size: 11px; white-space: nowrap; }
    .api-input {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 12px;
      width: 300px;
      transition: border-color .2s;
    }
    .api-input:focus { outline: none; border-color: var(--accent); }
    .api-input::placeholder { color: var(--text-dim); }
    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 4px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      transition: background .15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: var(--text-dim); cursor: not-allowed; }
    .api-link { color: var(--accent); font-size: 11px; text-decoration: none; white-space: nowrap; }
    .api-link:hover { text-decoration: underline; }
    .last-upd { margin-left: auto; color: var(--text-muted); font-size: 11px; white-space: nowrap; }

    /* ── BODY ─────────────────────────────── */
    .body { display: flex; flex: 1; overflow: hidden; }

    /* ── SIDEBAR ──────────────────────────── */
    .sidebar {
      width: 228px;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      flex-shrink: 0;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 2px; }

    .sb-cat {
      padding: 11px 12px 3px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: .8px;
    }
    .sb-item {
      padding: 6px 12px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background .12s;
    }
    .sb-item:hover { background: var(--bg-hover); }
    .sb-item.active { background: rgba(33,150,243,.1); border-left-color: var(--accent); }
    .sb-row { display: flex; justify-content: space-between; align-items: baseline; }
    .sb-name { font-size: 12px; color: var(--text-primary); font-weight: 500; }
    .sb-val  { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    .sb-meta { font-size: 10px; color: var(--text-dim); font-family: 'Courier New', monospace; margin-top: 1px; }

    /* ── CHART PANEL ──────────────────────── */
    .chart-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar {
      height: 44px;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 16px;
      flex-shrink: 0;
    }
    .tb-info { min-width: 0; }
    .tb-title   { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tb-sub     { font-size: 10px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tdiv { width: 1px; height: 20px; background: var(--border); flex-shrink: 0; }

    .range-group { display: flex; gap: 2px; flex-shrink: 0; }
    .rbtn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
      transition: all .12s;
    }
    .rbtn:hover { background: var(--bg-hover); color: var(--text-primary); }
    .rbtn.on { background: var(--accent); color: #fff; }

    .ma-group { display: flex; gap: 3px; margin-left: auto; flex-shrink: 0; }
    .matog {
      padding: 3px 7px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      border: 1px solid transparent;
      opacity: .35;
      transition: opacity .12s, background .12s;
    }
    .matog.on { opacity: 1; }
    .ma3  { border-color:#ff9800; color:#ff9800; }  .ma3.on  { background:rgba(255,152,0,.12); }
    .ma6  { border-color:#f44336; color:#f44336; }  .ma6.on  { background:rgba(244,67,54,.12); }
    .ma12 { border-color:#9c27b0; color:#9c27b0; }  .ma12.on { background:rgba(156,39,176,.12); }
    .ma24 { border-color:#2196f3; color:#2196f3; }  .ma24.on { background:rgba(33,150,243,.12); }
    .ma60 { border-color:#4caf50; color:#4caf50; }  .ma60.on { background:rgba(76,175,80,.12); }

    /* ── CANVAS WRAP ──────────────────────── */
    .canvas-wrap {
      flex: 1;
      position: relative;
      padding: 14px 16px 8px;
      overflow: hidden;
    }
    #mainChart { width: 100% !important; height: 100% !important; }

    /* ── OVERLAY ──────────────────────────── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg-primary);
      gap: 14px;
      z-index: 20;
    }
    .overlay.hidden { display: none; }
    .spinner {
      width: 30px; height: 30px;
      border: 3px solid var(--bg-hover);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .ov-msg  { color: var(--text-muted); font-size: 13px; text-align: center; max-width: 480px; line-height: 1.7; }
    .ov-err  { color: var(--red); }
    .ov-link { color: var(--accent); text-decoration: none; }
    .ov-link:hover { text-decoration: underline; }

    /* ── STATS BAR ────────────────────────── */
    .stats-bar {
      height: 46px;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 28px;
      padding: 0 18px;
      flex-shrink: 0;
    }
    .stat { display: flex; flex-direction: column; gap: 1px; }
    .stat-lbl { font-size: 9px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .5px; }
    .stat-val { font-size: 13px; font-weight: 700; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }
  </style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="logo">MACRO<span>LENS</span></div>
    <div class="hdiv"></div>
    <div class="api-row">
      <span class="api-label">FRED API Key</span>
      <input id="apiInput" type="password" class="api-input"
             placeholder="API Key 입력 (fred.stlouisfed.org 무료 발급)" />
      <button class="btn" onclick="saveKey()">저장</button>
      <a class="api-link" href="https://fredaccount.stlouisfed.org/apikey" target="_blank">키 발급 →</a>
    </div>
    <span class="last-upd" id="lastUpd">—</span>
  </div>

  <div class="body">

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- CHART PANEL -->
    <div class="chart-panel">

      <!-- TOOLBAR -->
      <div class="toolbar">
        <div class="tb-info">
          <div class="tb-title" id="tbTitle">지표를 선택하세요</div>
          <div class="tb-sub"  id="tbSub">← 왼쪽 목록에서 클릭</div>
        </div>
        <div class="tdiv"></div>
        <div class="range-group">
          <button class="rbtn"    onclick="setRange(12)">1Y</button>
          <button class="rbtn"    onclick="setRange(36)">3Y</button>
          <button class="rbtn on" onclick="setRange(60)">5Y</button>
          <button class="rbtn"    onclick="setRange(120)">10Y</button>
          <button class="rbtn"    onclick="setRange(0)">MAX</button>
        </div>
        <div class="ma-group">
          <button id="mb3"  class="matog ma3  on" onclick="toggleMA(3)">MA3</button>
          <button id="mb6"  class="matog ma6  on" onclick="toggleMA(6)">MA6</button>
          <button id="mb12" class="matog ma12 on" onclick="toggleMA(12)">MA12</button>
          <button id="mb24" class="matog ma24"    onclick="toggleMA(24)">MA24</button>
          <button id="mb60" class="matog ma60"    onclick="toggleMA(60)">MA60</button>
        </div>
      </div>

      <!-- CANVAS -->
      <div class="canvas-wrap">
        <canvas id="mainChart"></canvas>
        <div class="overlay" id="overlay">
          <div class="ov-msg">
            <strong style="color:var(--accent);font-size:14px;">FRED API Key가 필요합니다</strong><br><br>
            위 입력창에 API Key를 입력하면 미국 연준 FRED 데이터베이스에서<br>
            경제지표를 자동으로 불러옵니다.<br><br>
            👉 <a class="ov-link" href="https://fredaccount.stlouisfed.org/apikey" target="_blank">fred.stlouisfed.org</a>에서
            무료로 발급받을 수 있습니다 (약 1분 소요)
          </div>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-bar">
        <div class="stat"><span class="stat-lbl">최신값</span><span class="stat-val" id="sLatest">—</span></div>
        <div class="stat"><span class="stat-lbl">전월 대비</span><span class="stat-val" id="sMoM">—</span></div>
        <div class="stat"><span class="stat-lbl">전년 대비</span><span class="stat-val" id="sYoY">—</span></div>
        <div class="stat"><span class="stat-lbl">5년 평균</span><span class="stat-val" id="sAvg">—</span></div>
        <div class="stat"><span class="stat-lbl">5년 최고</span><span class="stat-val" id="sMax">—</span></div>
        <div class="stat"><span class="stat-lbl">5년 최저</span><span class="stat-val" id="sMin">—</span></div>
      </div>

    </div><!-- /chart-panel -->
  </div><!-- /body -->
</div><!-- /app -->

<script>
// ================================================================
// 경제지표 목록  ← 나중에 여기에 지표 추가
// ================================================================
const INDICATORS = [
  {
    cat: '물가 / Inflation',
    items: [
      { id:'CPIAUCSL',         name:'CPI (전체)',            unit:'Index', freq:'m', desc:'소비자물가지수 전체 (Bureau of Labor Statistics)' },
      { id:'CPILFESL',         name:'Core CPI',              unit:'Index', freq:'m', desc:'근원 소비자물가지수 — 식품·에너지 제외' },
      { id:'PCEPI',            name:'PCE 물가지수',          unit:'Index', freq:'m', desc:'개인소비지출 물가지수 (BEA)' },
      { id:'PCEPILFE',         name:'Core PCE',              unit:'Index', freq:'m', desc:'근원 PCE — 연준 선호 인플레이션 지표' },
    ]
  },
  {
    cat: '고용 / Employment',
    items: [
      { id:'UNRATE',   name:'실업률',          unit:'%',  freq:'m', desc:'미국 실업률 (Bureau of Labor Statistics)' },
      { id:'PAYEMS',   name:'비농업 고용',      unit:'K',  freq:'m', desc:'비농업 부문 고용자수 (천명)' },
      { id:'CIVPART',  name:'경제활동참가율',   unit:'%',  freq:'m', desc:'노동력 참가율 (Labor Force Participation Rate)' },
      { id:'JTSJOL',   name:'구인건수 (JOLTS)', unit:'K',  freq:'m', desc:'구인·이직 조사 구인 건수 (천건)' },
    ]
  },
  {
    cat: '성장 / Growth',
    items: [
      { id:'GDPC1',              name:'실질 GDP',     unit:'B$', freq:'q', desc:'실질 GDP — 2017년 불변가격 (BEA)' },
      { id:'A191RL1Q225SBEA',    name:'GDP 성장률',   unit:'%',  freq:'q', desc:'전분기 대비 GDP 성장률 (연율)' },
    ]
  },
  {
    cat: '금리 / Interest Rates',
    items: [
      { id:'FEDFUNDS',  name:'기준금리 (FFR)',      unit:'%',   freq:'m', desc:'미 연준 기준금리 (Fed Funds Rate)' },
      { id:'DGS10',     name:'10년물 국채',         unit:'%',   freq:'d', desc:'미국 10년 만기 국채 수익률' },
      { id:'DGS2',      name:'2년물 국채',          unit:'%',   freq:'d', desc:'미국 2년 만기 국채 수익률' },
      { id:'T10Y2Y',    name:'장단기 스프레드',     unit:'%p',  freq:'d', desc:'10년-2년 스프레드 — 경기침체 선행지표' },
    ]
  },
  {
    cat: '주택 / Housing',
    items: [
      { id:'HOUST',     name:'주택착공건수',              unit:'K',    freq:'m', desc:'신규 주택 착공 건수 (천 호, Census Bureau)' },
      { id:'CSUSHPISA', name:'케이스-실러 주택가격',      unit:'Index',freq:'m', desc:'S&P/케이스-실러 20대 도시 주택가격지수' },
      { id:'MORTGAGE30US',name:'30년 모기지 금리',        unit:'%',    freq:'w', desc:'30년 고정 모기지 평균 금리 (Freddie Mac)' },
    ]
  },
  {
    cat: '소비 / Consumer',
    items: [
      { id:'RSXFS',    name:'소매판매 (근원)',          unit:'M$',   freq:'m', desc:'근원 소매판매 — 자동차 제외 (Census Bureau)' },
      { id:'UMCSENT',  name:'미시간 소비자심리',        unit:'Index',freq:'m', desc:'미시간 대학 소비자심리지수' },
      { id:'PCE',      name:'개인소비지출 (PCE)',       unit:'B$',   freq:'m', desc:'개인소비지출 총액 (BEA)' },
    ]
  },
  {
    cat: '통화 / Money Supply',
    items: [
      { id:'M2SL',     name:'M2 통화량',   unit:'B$', freq:'m', desc:'M2 통화 공급량 (연준)' },
      { id:'BOGMBASE', name:'본원통화',    unit:'M$', freq:'m', desc:'연준 본원통화 (Monetary Base)' },
    ]
  },
  {
    cat: '국제 / International',
    items: [
      { id:'DTWEXBGS', name:'달러 인덱스 (무역가중)',  unit:'Index',freq:'d', desc:'무역가중 달러 지수 (Broad, 연준)' },
      { id:'BAMLH0A0HYM2', name:'하이일드 스프레드', unit:'%p', freq:'d', desc:'미국 하이일드 채권 옵션조정 스프레드 (ICE BofA)' },
    ]
  },
];

// MA 설정
const MA_PERIODS = [3, 6, 12, 24, 60];
const MA_COLOR = {
  3:  '#ff9800',
  6:  '#f44336',
  12: '#9c27b0',
  24: '#2196f3',
  60: '#4caf50',
};

// ================================================================
// STATE
// ================================================================
let apiKey      = localStorage.getItem('fredKey') || '';
let currentId   = null;
let cache       = {};           // { seriesId: [{date,value}] }
let rangeMonths = 60;
let maOn        = { 3:true, 6:true, 12:true, 24:false, 60:false };
let chart       = null;

// ================================================================
// BOOT
// ================================================================
document.addEventListener('DOMContentLoaded', () => {
  if (apiKey) {
    document.getElementById('apiInput').value = apiKey;
    document.getElementById('overlay').classList.add('hidden');
  }
  buildSidebar();
  initChart();
});

// ================================================================
// API KEY
// ================================================================
function saveKey() {
  const v = document.getElementById('apiInput').value.trim();
  if (!v) return;
  apiKey = v;
  localStorage.setItem('fredKey', v);
  document.getElementById('overlay').classList.add('hidden');
  if (currentId) load(currentId);
}

// ================================================================
// SIDEBAR
// ================================================================
function buildSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  INDICATORS.forEach(group => {
    const cat = document.createElement('div');
    cat.className = 'sb-cat';
    cat.textContent = group.cat;
    sb.appendChild(cat);
    group.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'sb-item';
      el.id = 'si-' + item.id;
      el.innerHTML = `
        <div class="sb-row">
          <span class="sb-name">${item.name}</span>
          <span class="sb-val" id="sv-${item.id}">—</span>
        </div>
        <div class="sb-meta">${item.id} · ${item.unit}</div>`;
      el.addEventListener('click', () => select(item.id));
      sb.appendChild(el);
    });
  });
}

function select(id) {
  document.querySelectorAll('.sb-item').forEach(e => e.classList.remove('active'));
  document.getElementById('si-' + id)?.classList.add('active');
  currentId = id;
  load(id);
}

function getMeta(id) {
  for (const g of INDICATORS)
    for (const it of g.items)
      if (it.id === id) return it;
  return null;
}

// ================================================================
// FRED FETCH  (localhost 서버로 열면 CORS 문제 없음)
// ================================================================
async function fredFetch(seriesId) {
  const url = `https://api.stlouisfed.org/fred/series/observations`
            + `?series_id=${seriesId}&api_key=${apiKey}&file_type=json&sort_order=asc`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();
  if (json.error_message) throw new Error(json.error_message);
  return json;
}

// ================================================================
// LOAD INDICATOR
// ================================================================
async function load(id) {
  if (!apiKey) { document.getElementById('overlay').classList.remove('hidden'); return; }
  const meta = getMeta(id);
  if (!meta) return;

  document.getElementById('tbTitle').textContent = meta.name;
  document.getElementById('tbSub').textContent   = meta.desc + '  ·  FRED: ' + id;
  showSpinner('데이터 불러오는 중...');

  try {
    if (!cache[id]) {
      const json = await fredFetch(id);
      cache[id] = json.observations
        .filter(o => o.value !== '.' && o.value !== '')
        .map(o => ({ date: o.date, value: parseFloat(o.value) }));
    }

    const data = cache[id];
    if (!data.length) throw new Error('데이터 없음');

    // Update sidebar latest value
    const latest = data[data.length - 1];
    const sv = document.getElementById('sv-' + id);
    if (sv) { sv.textContent = fmtVal(latest.value, meta.unit); sv.style.color = 'var(--text-primary)'; }

    document.getElementById('lastUpd').textContent = '최신: ' + latest.date;
    renderChart(data, meta);
    renderStats(data);
    hideOverlay();
  } catch (e) {
    showErr('로드 실패: ' + e.message);
    console.error(e);
  }
}

// ================================================================
// VALUE FORMAT
// ================================================================
function fmtVal(v, unit) {
  if (unit === '%' || unit === '%p') return v.toFixed(2) + '%';
  if (unit === 'Index')  return v.toFixed(1);
  if (unit === 'B$')     return (v >= 1000 ? (v/1000).toFixed(1) + 'T' : v.toFixed(0) + 'B');
  if (unit === 'M$')     return (v >= 1000 ? (v/1000).toFixed(1) + 'B' : v.toFixed(0) + 'M');
  if (unit === 'K')      return v.toLocaleString();
  return v.toFixed(3);
}

function fmtDiff(v) {
  if (v == null || isNaN(v)) return { text: '—', cls: '' };
  const s = v >= 0 ? '+' : '';
  return { text: s + v.toFixed(3), cls: v > 0 ? 'pos' : v < 0 ? 'neg' : '' };
}

// ================================================================
// OVERLAY
// ================================================================
function showSpinner(msg) {
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="spinner"></div><div class="ov-msg">${msg}</div>`;
  o.classList.remove('hidden');
}
function showErr(msg) {
  const o = document.getElementById('overlay');
  o.innerHTML = `<div class="ov-msg ov-err">⚠ ${msg}</div>`;
  o.classList.remove('hidden');
}
function hideOverlay() {
  document.getElementById('overlay').classList.add('hidden');
}

// ================================================================
// MOVING AVERAGE
// ================================================================
function calcMA(vals, p) {
  return vals.map((_, i) => {
    if (i < p - 1) return null;
    let s = 0;
    for (let j = i - p + 1; j <= i; j++) s += vals[j];
    return s / p;
  });
}

// ================================================================
// CHART INIT
// ================================================================
function initChart() {
  const ctx = document.getElementById('mainChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          labels: {
            color: '#787b86',
            font: { size: 11 },
            boxWidth: 16,
            padding: 14,
            filter: item => item.text !== '__raw__'
          }
        },
        tooltip: {
          backgroundColor: '#1e222d',
          borderColor: '#2a2e39',
          borderWidth: 1,
          titleColor: '#d1d4dc',
          bodyColor: '#d1d4dc',
          padding: 10,
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y == null) return null;
              return ` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}`;
            }
          }
        }
      },
      scales: {
        x: {
          ticks: { color:'#787b86', font:{ size:10 }, maxTicksLimit:14, maxRotation:0 },
          grid:  { color:'rgba(42,46,57,.6)' }
        },
        y: {
          ticks: { color:'#787b86', font:{ size:10 } },
          grid:  { color:'rgba(42,46,57,.6)' }
        }
      }
    }
  });
}

// ================================================================
// CHART RENDER
// ================================================================
function renderChart(raw, meta) {
  // Range filter
  let data = raw;
  if (rangeMonths > 0) {
    const cut = new Date();
    cut.setMonth(cut.getMonth() - rangeMonths);
    data = raw.filter(d => new Date(d.date) >= cut);
  }

  const labels = data.map(d => d.date);
  const vals   = data.map(d => d.value);
  const ds     = [];

  // Raw line
  ds.push({
    label: meta.name,
    data: vals,
    borderColor: '#26a69a',
    backgroundColor: 'rgba(38,166,154,.04)',
    borderWidth: 1.8,
    pointRadius: 0,
    pointHoverRadius: 3,
    tension: 0.1,
    fill: false,
    order: 99,
  });

  // MA lines
  MA_PERIODS.forEach((p, i) => {
    if (!maOn[p]) return;
    ds.push({
      label: `MA${p}`,
      data: calcMA(vals, p),
      borderColor: MA_COLOR[p],
      backgroundColor: 'transparent',
      borderWidth: 1.5,
      pointRadius: 0,
      pointHoverRadius: 0,
      tension: 0.1,
      fill: false,
      spanGaps: false,
      order: i,
    });
  });

  chart.data.labels   = labels;
  chart.data.datasets = ds;
  chart.update('none');
}

// ================================================================
// STATS
// ================================================================
function renderStats(raw) {
  const n   = raw.length;
  if (!n) return;

  const lat  = raw[n-1].value;
  const prev = n > 1  ? raw[n-2].value  : null;
  const yr   = n > 12 ? raw[n-13].value : null;

  const cut5 = new Date(); cut5.setFullYear(cut5.getFullYear() - 5);
  const v5   = raw.filter(d => new Date(d.date) >= cut5).map(d => d.value);
  const avg5 = v5.length ? v5.reduce((a,b)=>a+b,0)/v5.length : null;
  const max5 = v5.length ? Math.max(...v5) : null;
  const min5 = v5.length ? Math.min(...v5) : null;

  document.getElementById('sLatest').textContent = lat.toFixed(3);

  const mom = fmtDiff(prev != null ? lat - prev : null);
  const yoy = fmtDiff(yr   != null ? lat - yr   : null);
  const mEl = document.getElementById('sMoM');
  const yEl = document.getElementById('sYoY');
  mEl.textContent = mom.text; mEl.className = 'stat-val ' + mom.cls;
  yEl.textContent = yoy.text; yEl.className = 'stat-val ' + yoy.cls;

  document.getElementById('sAvg').textContent = avg5 != null ? avg5.toFixed(2) : '—';
  document.getElementById('sMax').textContent = max5 != null ? max5.toFixed(2) : '—';
  document.getElementById('sMin').textContent = min5 != null ? min5.toFixed(2) : '—';
}

// ================================================================
// CONTROLS
// ================================================================
function setRange(m) {
  rangeMonths = m;
  const labels = { 12:'1Y', 36:'3Y', 60:'5Y', 120:'10Y', 0:'MAX' };
  document.querySelectorAll('.rbtn').forEach(b => {
    b.classList.toggle('on', b.textContent === (labels[m] || ''));
  });
  if (currentId && cache[currentId]) renderChart(cache[currentId], getMeta(currentId));
}

function toggleMA(p) {
  maOn[p] = !maOn[p];
  document.getElementById('mb' + p).classList.toggle('on', maOn[p]);
  if (currentId && cache[currentId]) renderChart(cache[currentId], getMeta(currentId));
}
</script>
