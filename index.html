<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>경제레이더 · 민홍</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --sidebar-bg: #161b22;
      --panel-bg: #1c2128;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
      --active-bg: #1f3a5f;
      --category-color: #7ee787;
      --red: #f85149;
      --yellow: #e3b341;
      --sidebar-width: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      width: var(--sidebar-width);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 16px 14px 12px;
      border-bottom: 1px solid var(--border);
    }

    #sidebar-header h1 {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    #sidebar-header p {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .category-label {
      padding: 10px 14px 4px;
      font-size: 9px;
      font-weight: 700;
      color: var(--category-color);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .indicator-item {
      padding: 7px 14px;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .indicator-item:hover { background: rgba(88,166,255,0.06); }
    .indicator-item.active { background: var(--active-bg); }
    .indicator-item.overlaid { background: rgba(127,231,135,0.07); }

    .overlay-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 4px;
      font-size: 11px;
      width: 18px; height: 18px;
      line-height: 1;
      cursor: pointer;
      flex-shrink: 0;
      margin-left: 4px;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .indicator-item:hover .overlay-btn { display: flex; }
    .overlay-btn:hover { border-color: var(--category-color); color: var(--category-color); }
    .overlay-btn.active-overlay { display: flex; border-color: var(--category-color); color: var(--category-color); background: rgba(127,231,135,0.15); }

    #overlay-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    .overlay-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 6px 2px 8px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .overlay-chip-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .overlay-chip-dot:hover { transform: scale(1.3); }

    .overlay-chip-x {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0 0 0 2px;
    }
    .overlay-chip-x:hover { color: var(--red); }

    .indicator-item .name {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .indicator-item .meta {
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .indicator-item .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--border);
      flex-shrink: 0;
      margin-left: 8px;
      transition: background 0.3s;
    }

    .indicator-item .status-dot.loaded { background: var(--category-color); }
    .indicator-item .status-dot.loading { background: var(--yellow); }
    .indicator-item .status-dot.error { background: var(--red); }

    /* ── MAIN ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--sidebar-bg);
      flex-shrink: 0;
    }

    #chart-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    #chart-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    #controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .range-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .range-btn:hover { border-color: var(--accent); color: var(--accent); }
    .range-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    #chart-area {
      flex: 1;
      padding: 20px 24px;
      overflow: hidden;
      position: relative;
    }

    #chart-wrapper {
      width: 100%;
      height: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      position: relative;
    }

    #myChart { width: 100% !important; height: 100% !important; }

    #loading-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(28,33,40,0.85);
      border-radius: 10px;
      font-size: 13px;
      color: var(--text-muted);
      gap: 10px;
      z-index: 10;
    }

    .spinner {
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #legend-area {
      padding: 10px 24px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      flex-shrink: 0;
      background: var(--sidebar-bg);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: var(--text-muted);
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 4px;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .legend-color:hover {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px rgba(255,255,255,0.3);
    }
    .legend-color::after {
      content: '✎';
      position: absolute;
      top: -14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 8px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
    }
    .legend-color:hover::after { opacity: 1; }

    #latest-value {
      margin-left: auto;
      font-size: 11px;
      color: var(--text-muted);
    }

    #latest-value span {
      font-weight: 700;
      font-size: 13px;
      color: var(--accent);
    }

    #error-msg {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      background: rgba(28,33,40,0.85);
      border-radius: 10px;
      z-index: 10;
    }

    #error-msg .err-icon { font-size: 32px; }
    #error-msg .err-text { font-size: 13px; color: var(--text-muted); }
    #error-msg .err-detail { font-size: 11px; color: var(--red); max-width: 400px; text-align: center; }

    /* API Key설정 모달 */
    #api-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    #api-modal.show { display: flex; }

    #api-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 32px;
      width: 420px;
    }

    #api-box h2 { font-size: 16px; margin-bottom: 6px; }
    #api-box p { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }

    #api-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 12px;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      margin-bottom: 12px;
    }

    #api-box button {
      width: 100%;
      background: var(--accent);
      border: none;
      border-radius: 6px;
      padding: 9px;
      color: #0d1117;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .api-setting-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .api-setting-btn:hover { color: var(--text); }

    #country-tabs {
      display: flex;
      gap: 4px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
    }

    .country-btn {
      flex: 1;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 5px 4px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .country-btn.active {
      background: var(--active-bg);
      border-color: var(--accent);
      color: var(--accent);
    }

    .country-btn.disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .country-btn:not(.disabled):hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    #stat-boxes {
      display: none;
      gap: 8px;
      align-items: center;
    }

    #cot-bar {
      display: none;
      gap: 5px;
      align-items: center;
      margin-left: 12px;
    }
    .cot-cat-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cot-cat-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cot-cat-btn.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: 600; }

    .cot-view-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cot-view-btn:hover { border-color: var(--category-color); color: var(--category-color); }
    .cot-view-btn.active { background: var(--category-color); border-color: var(--category-color); color: #0d1117; font-weight: 600; }

    .stat-box {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 14px;
      text-align: center;
      min-width: 90px;
    }

    .stat-box-label {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-box-val {
      font-size: 15px;
      font-weight: 700;
      margin-top: 1px;
    }

    .stat-pos { color: #7ee787; }
    .stat-neg { color: #f85149; }
    .stat-neutral { color: var(--text-muted); }

    .stat-box {
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .stat-box:hover { border-color: var(--accent); }
    .stat-box.active {
      border-color: var(--accent);
      background: var(--active-bg);
    }
    .stat-box.active .stat-box-label { color: var(--accent); }

    #yrange-bar {
      display: none;
      gap: 6px;
      align-items: center;
      margin-left: auto;
      font-size: 10px;
      color: var(--text-muted);
    }
    .yrange-input {
      width: 64px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 3px 7px;
      color: var(--text);
      font-size: 11px;
      text-align: center;
    }
    .yrange-input:focus { outline: none; border-color: var(--accent); }
    #reset-zoom-btn {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 3px 9px;
      border-radius: 5px;
      font-size: 10px;
      cursor: pointer;
    }
    #reset-zoom-btn:hover { border-color: var(--accent); color: var(--accent); }
    /* ─── 수급 패널 ─────────────────────────────── */
    #supply-panel { display:none; flex:1; overflow:auto; padding:18px 22px; }
    #supply-panel.show { display:block; }
    .sup-subtabs { display:flex; gap:8px; margin-bottom:16px; }
    .sup-subtab {
      background:var(--panel-bg); border:1px solid var(--border); color:var(--text-muted);
      padding:7px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    }
    .sup-subtab.active { color:var(--text); border-color:var(--accent); background:#21304a; }
    .sup-view { display:none; }
    .sup-view.show { display:block; }
    .sup-note { font-size:11px; color:var(--text-muted); margin:0 0 12px; }
    .sup-note b { color:#e3b341; }
    .sup-range { display:flex; align-items:center; gap:8px; margin-bottom:12px; font-size:12px; color:var(--text-muted); flex-wrap:wrap; }
    .sup-range input[type=date] { background:var(--panel-bg); border:1px solid var(--border); color:var(--text); border-radius:6px; padding:4px 8px; font-size:12px; color-scheme:dark; }
    .sup-mini { background:var(--panel-bg); border:1px solid var(--border); color:var(--text-muted); border-radius:6px; padding:4px 10px; font-size:11px; cursor:pointer; }
    .sup-mini:hover { border-color:var(--accent); color:var(--text); }
    .sup-mini.active { border-color:var(--accent); color:var(--text); background:#21304a; }
    .sigma-block { margin-bottom:18px; }
    .sigma-block h4 { margin:0 0 6px; font-size:12px; color:var(--accent); font-weight:600; }
    .sup-table { border-collapse:collapse; width:100%; font-size:12px; font-variant-numeric:tabular-nums; }
    .sup-table th, .sup-table td {
      border:1px solid var(--border); padding:6px 9px; text-align:right; white-space:nowrap;
    }
    .sup-table thead th { background:#161b22; color:var(--text-muted); font-weight:600; text-align:center; }
    .sup-table th.grp-spot   { background:#1b2733; }
    .sup-table th.grp-fut    { background:#1d2b24; }
    .sup-table th.grp-opt    { background:#2a2620; }
    .sup-table th.grp-sfut   { background:#271f2b; }
    .sup-table td.date-col, .sup-table th.date-col { text-align:center; color:var(--text); font-weight:600; }
    .sup-table td.win-col,  .sup-table th.win-col  { text-align:center; color:var(--text); font-weight:600; background:#161b22; }
    .sup-table tbody tr:hover td { background:#1a2029; }
    .sup-table td.grp-sep { border-left:2px solid #3d4651; }
    .sup-table th.grp-sep { border-left:2px solid #3d4651; }
    .sup-pos { color:#3fb950; }
    .sup-neg { color:#f85149; }
    .sup-zero { color:var(--text-muted); }
    .sup-chk { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
    .sup-table td.chk-col { text-align:center; }
  </style>
</head>
<body>

<!-- Sidebar -->
<nav id="sidebar">
  <div id="sidebar-header">
    <h1>경제레이더 · 민홍</h1>
    <p id="last-updated">데이터 로딩 전</p>
  </div>
  <div id="country-tabs">
    <button class="country-btn active" data-country="US">🇺🇸 US</button>
    <button class="country-btn" data-country="KR">🇰🇷 KR</button>
    <button class="country-btn" data-country="JP">🇯🇵 JP</button>
    <button class="country-btn" data-country="SENTI">📐 센티먼트</button>
    <button class="country-btn" data-country="COT">📊 COT</button>
    <button class="country-btn" data-country="SUPPLY">💹 수급</button>
    <button class="country-btn disabled" data-country="EU" title="준비 중">🇪🇺 EU</button>
  </div>
  <div id="sidebar-scroll" id="indicator-list"></div>
</nav>

<!-- Main -->
<main id="main">
  <div id="topbar">
    <div>
      <div id="chart-title">지표를 선택하세요</div>
      <div id="chart-subtitle">—</div>
    </div>
    <div id="stat-boxes">
      <div class="stat-box">
        <div class="stat-box-label">YoY</div>
        <div class="stat-box-val stat-neutral" id="stat-yoy-val">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">MoM</div>
        <div class="stat-box-val stat-neutral" id="stat-mom-val">—</div>
      </div>
    </div>
    <div id="cot-bar">
      <button class="cot-cat-btn active" data-cot="noncomm">투기세력</button>
      <button class="cot-cat-btn" data-cot="comm">실수요자</button>
      <button class="cot-cat-btn" data-cot="nonrept">소액</button>
      <span style="width:1px;height:18px;background:var(--border);margin:0 4px"></span>
      <button class="cot-view-btn active" data-view="net">순포지션</button>
      <button class="cot-view-btn" data-view="index">COT Index</button>
    </div>
    <div id="controls">
      <button class="range-btn" data-years="5">5Y</button>
      <button class="range-btn active" data-years="10">10Y</button>
      <button class="range-btn" data-years="20">20Y</button>
      <button class="range-btn" data-years="0">All</button>
      <button class="api-setting-btn" id="api-btn">⚙ API Key</button>
    </div>
  </div>

  <div id="chart-area">
    <div id="chart-wrapper">
      <canvas id="myChart"></canvas>
      <div id="loading-overlay"><div class="spinner"></div> 데이터 불러오는 중...</div>
      <div id="error-msg">
        <div class="err-icon">⚠</div>
        <div class="err-text">데이터를 불러올 수 없습니다</div>
        <div class="err-detail" id="err-detail-text"></div>
      </div>
    </div>
  </div>

  <div id="legend-area">
    <div class="legend-item"><div class="legend-color" style="background:#58a6ff"></div> Raw</div>
    <div class="legend-item"><div class="legend-color" style="background:#ff7b72;opacity:0.9"></div> MA3</div>
    <div class="legend-item"><div class="legend-color" style="background:#ffa657;opacity:0.9"></div> MA6</div>
    <div class="legend-item"><div class="legend-color" style="background:#7ee787;opacity:0.9"></div> MA12</div>
    <div class="legend-item"><div class="legend-color" style="background:#d2a8ff;opacity:0.9"></div> MA24</div>
    <div class="legend-item"><div class="legend-color" style="background:#e3b341;opacity:0.9"></div> MA60</div>
    <div id="overlay-chips"></div>
    <button id="reset-zoom-btn">↺ Reset</button>
    <div id="yrange-bar">
      Y축: <input class="yrange-input" id="ymin-input" placeholder="Min" />
      ~ <input class="yrange-input" id="ymax-input" placeholder="Max" />
    </div>
    <div id="latest-value">최신값: <span id="latest-val-num">—</span></div>
  </div>

  <!-- 수급 패널 -->
  <div id="supply-panel">
    <div class="sup-subtabs">
      <button class="sup-subtab active" data-sup="today">📋 당일 수급</button>
      <button class="sup-subtab" data-sup="sigma">📊 수급 시그마</button>
    </div>
    <p class="sup-note">단위: 억원 · 순매수(+매수우위 / −매도우위) · <b>샘플 데이터</b> (KRX 연동 전, 모양 확인용) · 초록=＋ 빨강=−</p>
    <div class="sup-view show" id="sup-view-today">

// ─── TRANSFORMS ──────────────────────────────────────────────────────────────
function calcMoM(data) {
  return data.map((pt, i) => {
    if (i === 0) return { x: pt.x, y: null };
    const prev = data[i - 1];
    if (!prev || prev.y === null || prev.y === 0) return { x: pt.x, y: null };
    return { x: pt.x, y: +((pt.y - prev.y) / Math.abs(prev.y) * 100).toFixed(2) };
  }).filter(pt => pt.y !== null);
}

// 절대 변화량 (퍼센트 아닌 실제 수치 차이) — 비농업 고용 같은 지표에 사용
function calcAbsDiff(data) {
  return data.map((pt, i) => {
    if (i === 0) return { x: pt.x, y: null };
    const prev = data[i - 1];
    if (!prev || prev.y === null) return { x: pt.x, y: null };
    return { x: pt.x, y: +(pt.y - prev.y).toFixed(1) };
  }).filter(pt => pt.y !== null);
}

function applyTransform(raw, mode, ind) {
  if (mode === 'yoy') return calcYoY(raw);
  if (mode === 'mom') return (ind?.diffMode) ? calcAbsDiff(raw) : calcMoM(raw);
  return raw;
}

function defaultMode(ind) {
  return ind.transform === 'yoy' ? 'yoy' : 'raw';
}

// ─── YOY TRANSFORM ───────────────────────────────────────────────────────────
function calcYoY(data) {
  return data.map(pt => {
    const d = new Date(pt.x);
    const prevYear = d.getFullYear() - 1;
    const prevMonth = d.getMonth();
    const prev = data.find(p => {
      const pd = new Date(p.x);
      return pd.getFullYear() === prevYear && pd.getMonth() === prevMonth;
    });
    if (!prev) return { x: pt.x, y: null };
    return { x: pt.x, y: +((pt.y - prev.y) / prev.y * 100).toFixed(2) };
  }).filter(pt => pt.y !== null);
}

// ─── STATS (YoY / MoM) ───────────────────────────────────────────────────────
function calcStats(rawData, ind) {
  if (!rawData || rawData.length < 2) return null;
  const latest = rawData[rawData.length - 1];

  if (ind.transform === 'yoy') {
    const yoyData = calcYoY(rawData);
    if (yoyData.length < 2) return null;
    const last = yoyData[yoyData.length - 1];
    const prev = yoyData[yoyData.length - 2];
    return {
      yoy: { val: last.y, suffix: '%', label: 'YoY' },
      mom: { val: +(last.y - prev.y).toFixed(2), suffix: 'pp', label: 'MoM Δ' },
    };
  }

  // Raw stats: find prev month & prev year
  const latestDate = new Date(latest.x);
  const prevMonthDate = new Date(latestDate);
  prevMonthDate.setMonth(prevMonthDate.getMonth() - 1);
  const prevMonthStr = prevMonthDate.toISOString().slice(0, 7);
  const prevYearDate = new Date(latestDate);
  prevYearDate.setFullYear(prevYearDate.getFullYear() - 1);
  const prevYearStr = prevYearDate.toISOString().slice(0, 7);

  const prevMonth = [...rawData].reverse().find(p => p.x.slice(0, 7) === prevMonthStr)
    || [...rawData].reverse().find(p => p.x.slice(0, 7) <= prevMonthStr);
  const prevYear  = [...rawData].reverse().find(p => p.x.slice(0, 7) === prevYearStr)
    || [...rawData].reverse().find(p => p.x.slice(0, 7) <= prevYearStr);

  const pct = (a, b) => b ? +((a - b) / Math.abs(b) * 100).toFixed(2) : null;
  const abs = (a, b) => b !== undefined ? +(a - b).toFixed(1) : null;

  if (ind.diffMode) {
    // 비농업 고용처럼 절대 변화량으로 보는 게 맞는 지표
    return {
      yoy: prevYear  ? { val: abs(latest.y, prevYear.y),  suffix: ind.unit, label: 'YoY Δ' } : null,
      mom: prevMonth ? { val: abs(latest.y, prevMonth.y), suffix: ind.unit, label: 'MoM Δ' } : null,
    };
  }

  return {
    yoy: prevYear  ? { val: pct(latest.y, prevYear.y),  suffix: '%', label: 'YoY' } : null,
    mom: prevMonth ? { val: pct(latest.y, prevMonth.y), suffix: '%', label: 'MoM' } : null,
  };
}

function renderStatBoxes(stats, ind) {
  const el = document.getElementById('stat-boxes');
  if (!stats || ind.noStats) { el.style.display = 'none'; return; }

  const fmt = (s) => {
    if (!s || s.val === null) return { text: '—', cls: 'stat-neutral' };
    const sign = s.val > 0 ? '+' : '';
    return { text: `${sign}${s.val}${s.suffix}`, cls: s.val > 0 ? 'stat-pos' : (s.val < 0 ? 'stat-neg' : 'stat-neutral') };
  };

  const yoyLabel = ind.transform === 'yoy' ? 'YoY ▸ Chart' : 'YoY ▸ Chart';
  const momLabel = ind.transform === 'yoy' ? 'MoM Δ ▸ Chart' : 'MoM ▸ Chart';
  document.querySelector('.stat-box:nth-child(1) .stat-box-label').textContent = yoyLabel;
  document.querySelector('.stat-box:nth-child(2) .stat-box-label').textContent = momLabel;

  const yoyFmt = fmt(stats.yoy);
  const momFmt = fmt(stats.mom);
  const yoyEl = document.getElementById('stat-yoy-val');
  const momEl = document.getElementById('stat-mom-val');
  yoyEl.textContent = yoyFmt.text;
  yoyEl.className = `stat-box-val ${yoyFmt.cls}`;
  momEl.textContent = momFmt.text;
  momEl.className = `stat-box-val ${momFmt.cls}`;

  // Highlight active mode
  document.querySelectorAll('.stat-box').forEach(b => b.classList.remove('active'));
  if (currentMode === 'yoy') document.querySelector('.stat-box:nth-child(1)').classList.add('active');
  if (currentMode === 'mom') document.querySelector('.stat-box:nth-child(2)').classList.add('active');

  el.style.display = 'flex';
}

// ─── MOVING AVERAGE ───────────────────────────────────────────────────────────
function calcMA(data, period) {
  return data.map((pt, i) => {
    if (i < period - 1) return { x: pt.x, y: null };
    let sum = 0;
    for (let j = i - period + 1; j <= i; j++) sum += data[j].y;
    return { x: pt.x, y: +(sum / period).toFixed(4) };
  });
}

// ─── FETCH: CFTC COT (선물 포지션) ───────────────────────────────────────────
async function fetchCOT(cotName) {
  const cacheKey = `cot_${cotName}`;
  if (cache[cacheKey]) return cache[cacheKey];

  const where = encodeURIComponent(`contract_market_name='${cotName}'`);
  const url = `https://publicreporting.cftc.gov/resource/6dca-aqww.json?`
    + `$select=report_date_as_yyyy_mm_dd,noncomm_positions_long_all,noncomm_positions_short_all,`
    + `comm_positions_long_all,comm_positions_short_all,nonrept_positions_long_all,nonrept_positions_short_all`
    + `&$where=${where}&$order=report_date_as_yyyy_mm_dd ASC&$limit=2000`;
  const proxied = `https://corsproxy.io/?${encodeURIComponent(url)}`;

  let res;
  try { res = await fetch(proxied); }
  catch (e) { throw new Error('네트워크 오류: CFTC 서버에 연결할 수 없습니다.'); }
  if (!res.ok) throw new Error(`CFTC 서버 오류 (HTTP ${res.status})`);
  const json = await res.json();
  if (!Array.isArray(json) || json.length === 0) throw new Error('COT 데이터 없음');

  let rows = json.map(o => ({
    x: o.report_date_as_yyyy_mm_dd?.slice(0, 10),
    ncL: +o.noncomm_positions_long_all || 0,
    ncS: +o.noncomm_positions_short_all || 0,
    cL:  +o.comm_positions_long_all || 0,
    cS:  +o.comm_positions_short_all || 0,
    nrL: +o.nonrept_positions_long_all || 0,
    nrS: +o.nonrept_positions_short_all || 0,
  })).filter(r => r.x);

  // 날짜순 정렬 + 중복 날짜 제거 (rolling 계산 정확도 위해 필수)
  rows.sort((a, b) => a.x.localeCompare(b.x));
  const seen = new Set();
  rows = rows.filter(r => seen.has(r.x) ? false : (seen.add(r.x), true));

  cache[cacheKey] = rows;
  return rows;
}

// COT 원본 → 선택 카테고리의 순포지션(long-short) {x,y} 배열로 변환
function cotNetSeries(rows, cat) {
  return rows.map(r => {
    let net;
    if (cat === 'comm')        net = r.cL - r.cS;
    else if (cat === 'nonrept') net = r.nrL - r.nrS;
    else                        net = r.ncL - r.ncS; // noncomm (투기) 기본
    return { x: r.x, y: net };
  });
}

const COT_CAT_LABEL = { noncomm: '투기세력', comm: '실수요자', nonrept: '소액' };

// COT Index: 순포지션을 과거 lookback주 기준 0~100으로 정규화 (3년=156주) + smooth주 평활
// 윈도우가 다 안 찬 초기 구간은 null (불안정 → 그리지 않음)
function calcCotIndex(net, lookback = 156, smooth = 6) {
  const raw = net.map((p, i) => {
    if (i < lookback - 1) return { x: p.x, y: null };
    const win = net.slice(i - lookback + 1, i + 1).map(q => q.y);
    const mn = Math.min(...win), mx = Math.max(...win);
    const idx = (mx === mn) ? 50 : (p.y - mn) / (mx - mn) * 100;
    return { x: p.x, y: idx };
  });
  // 평활 (톱니 제거, null은 무시)
  return raw.map((p, i) => {
    if (p.y === null) return p;
    const start = Math.max(0, i - smooth + 1);
    const win = raw.slice(start, i + 1).map(q => q.y).filter(v => v !== null);
    return { x: p.x, y: win.length ? +(win.reduce((a, b) => a + b, 0) / win.length).toFixed(1) : null };
  });
}

// 0~100 정규화 (가격 다이버전스 비교용, 표시 구간 기준)
function normalize0100(series) {
  const ys = series.filter(p => p.y != null).map(p => p.y);
  if (!ys.length) return series;
  const mn = Math.min(...ys), mx = Math.max(...ys);
  return series.map(p => ({ x: p.x, y: (mx === mn) ? 50 : +((p.y - mn) / (mx - mn) * 100).toFixed(1) }));
}

// Yahoo Finance 주간 가격 (선물)
async function fetchYahooWeekly(symbol, range = '10y') {
  const cacheKey = `yf_${symbol}_${range}`;
  if (cache[cacheKey]) return cache[cacheKey];
  const url = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1wk&range=${range}`;
  const proxied = `https://corsproxy.io/?${encodeURIComponent(url)}`;
  const j = await fetch(proxied).then(r => r.json());
  const r = j.chart?.result?.[0];
  if (!r) throw new Error('가격 데이터 없음');
  const ts = r.timestamp || [];
  const closes = r.indicators?.quote?.[0]?.close || [];
  const pts = ts.map((t, i) => ({
    x: new Date(t * 1000).toISOString().slice(0, 10),
    y: closes[i] != null ? +closes[i].toFixed(4) : null
  })).filter(p => p.y !== null);
  cache[cacheKey] = pts;
  return pts;
}

// CNN Fear & Greed API (풋콜 비율 등, 약 1년 일간)
// 방문할 때마다 localStorage에 누적 머지 → 시간이 지날수록 히스토리가 길어짐
async function fetchCNN(key) {
  const cacheKey = `cnn_${key}`;
  if (cache[cacheKey]) return cache[cacheKey];

  // 1) 기존 누적분 로드
  const storeKey = `cnnhist_${key}`;
  let stored = {};
  try { stored = JSON.parse(localStorage.getItem(storeKey) || '{}'); } catch (e) {}

  // 2) 신규 1년치 받아서 머지 (실패해도 누적분으로 그림)
  try {
    const url = 'https://production.dataviz.cnn.io/index/fearandgreed/graphdata';
    const j = await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`).then(r => r.json());
    const arr = j[key]?.data || [];
    arr.filter(d => d.y != null).forEach(d => {
      const date = new Date(d.x).toISOString().slice(0, 10);
      stored[date] = +(+d.y).toFixed(3);   // 날짜별 머지 (신규 우선)
    });
    localStorage.setItem(storeKey, JSON.stringify(stored));
  } catch (e) { /* 네트워크 실패 시 기존 누적분만 사용 */ }

  const pts = Object.entries(stored)
    .map(([x, y]) => ({ x, y: +y }))
    .sort((a, b) => a.x.localeCompare(b.x));
  if (!pts.length) throw new Error('CNN 데이터 없음');
  cache[cacheKey] = pts;
  return pts;
}

// 두 티커의 비율 시리즈 (예: MTUM/SPY 상대성과)
async function fetchRatio(numSym, denomSym, range = 'max') {
  const [num, den] = await Promise.all([
    fetchYahooWeekly(numSym, range),
    fetchYahooWeekly(denomSym, range),
  ]);
  const denMap = new Map(den.map(p => [p.x, p.y]));
  return num
    .filter(p => denMap.has(p.x) && denMap.get(p.x))
    .map(p => ({ x: p.x, y: +(p.y / denMap.get(p.x)).toFixed(4) }));
}

// ─── FETCH: TSA CHECKPOINT ───────────────────────────────────────────────────
async function fetchTSA() {
  if (cache['TSA']) return cache['TSA'];

  // TSA HTML 파싱 헬퍼
  // 각 행: "날짜 현재연도값 [전년값 전전년값 ...]"
  // colYears: col0(날짜 제외 첫째)부터 각 열이 어떤 연도인지
  const parseHTML = (html, colYears) => {
    const rows = (html.match(/<tr[^>]*>[\s\S]*?<\/tr>/gi) || [])
      .map(r => r.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim())
      .filter(r => /^\d+\/\d+\/\d{4}/.test(r));
    const pts = {};
    for (const row of rows) {
      const parts = row.split(/\s+/);
      const [m, d, baseYear] = parts[0].split('/').map(Number);
      colYears.forEach((yr, i) => {
        const raw = parts[i + 1]?.replace(/,/g, '');
        const val = parseFloat(raw);
        if (!isNaN(val) && val > 0) {
          // Feb 29 → 비윤년이면 Feb 28로 대체
          let day = d;
          if (m === 2 && d === 29) {
            const isLeap = yr % 4 === 0 && (yr % 100 !== 0 || yr % 400 === 0);
            if (!isLeap) day = 28;
          }
          const key = `${yr}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
          if (!pts[key]) pts[key] = val; // 먼저 온 게 우선
        }
      });
    }
    return pts;
  };

  const proxy = u => `https://corsproxy.io/?${encodeURIComponent(u)}`;
  const TSA_URL = 'https://www.tsa.gov/travel/passenger-volumes';
  const SNAP_2023 = 'https://web.archive.org/web/20230101185405/' + TSA_URL;
  // Wayback CDX로 2025 스냅샷 URL 동적 조회
  const snap2025Res = await fetch('https://archive.org/wayback/available?url=tsa.gov/travel/passenger-volumes&timestamp=20250101')
    .then(r => r.json()).catch(() => null);
  const SNAP_2025 = snap2025Res?.archived_snapshots?.closest?.url
    || 'https://web.archive.org/web/20250101000000/' + TSA_URL;

  const [html2023, html2025, htmlNow] = await Promise.all([
    fetch(proxy(SNAP_2023)).then(r => r.text()),
    fetch(proxy(SNAP_2025)).then(r => r.text()),
    fetch(proxy(TSA_URL)).then(r => r.text()),
  ]);

  const currentYear = new Date().getFullYear();
  const all = {
    ...parseHTML(html2023, [2022, 2021, 2020, 2019]),
    ...parseHTML(html2025, [2024, 2023]),
    ...parseHTML(htmlNow,  [currentYear]),
  };

  const points = Object.entries(all)
    .map(([x, y]) => ({ x, y }))
    .sort((a, b) => a.x.localeCompare(b.x));

  if (points.length === 0) throw new Error('TSA 데이터를 가져오지 못했습니다.');
  cache['TSA'] = points;
  return points;
}

// ─── FETCH ────────────────────────────────────────────────────────────────────
async function fetchFRED(seriesId, freq) {
  if (!apiKey) {
    throw new Error('API 키가 없습니다. 우측 상단 ⚙ API Key 버튼에서 입력하세요.');
  }
  const cacheKey = `${seriesId}_${freq||''}`;
  if (cache[cacheKey]) return cache[cacheKey];

  const freqParam = freq ? `&frequency=${freq}&aggregation_method=avg` : '';
  const fredUrl = `https://api.stlouisfed.org/fred/series/observations?series_id=${seriesId}&api_key=${apiKey}&file_type=json&sort_order=asc${freqParam}`;
  const url = `https://corsproxy.io/?${encodeURIComponent(fredUrl)}`;
  let res;
  try {
    res = await fetch(url);
  } catch (netErr) {
    throw new Error('네트워크 오류: 데이터를 불러올 수 없습니다.\n• 인터넷 연결을 확인하세요\n• 잠시 후 다시 시도하세요');
  }
  if (!res.ok) {
    throw new Error(`FRED 서버 오류 (HTTP ${res.status}): 잠시 후 다시 시도하세요.`);
  }
  const json = await res.json();
  if (json.error_message) throw new Error(`FRED API 오류: ${json.error_message}`);

  const points = json.observations
    .filter(o => o.value !== '.' && o.value !== '')
    .map(o => ({ x: o.date, y: parseFloat(o.value) }));

  cache[cacheKey] = points;
  return points;
}

// ─── CHART ────────────────────────────────────────────────────────────────────
function filterByYears(data, years) {
  if (!years) return data;
  const cutoff = new Date();
  cutoff.setFullYear(cutoff.getFullYear() - years);
  const cutStr = cutoff.toISOString().slice(0,10);
  return data.filter(p => p.x >= cutStr);
}

// 커서 추적 세로 점선 (십자선)
const crosshairPlugin = {
  id: 'crosshair',
  afterDatasetsDraw(chart) {
    const active = chart.tooltip?.getActiveElements?.() || [];
    if (!active.length) return;
    const x = active[0].element.x;
    const { top, bottom } = chart.chartArea;
    const c = chart.ctx;
    c.save();
    c.beginPath();
    c.moveTo(x, top);
    c.lineTo(x, bottom);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(230,237,243,0.45)';
    c.setLineDash([4, 4]);
    c.stroke();
    c.restore();
  }
};

        type: 'line',
        label: rl.label || `기준 ${rl.y}`,
        data: [{ x: x0, y: rl.y }, { x: x1, y: rl.y }],
        borderColor: rl.color || 'rgba(139,148,158,0.6)',
        borderWidth: 1,
        borderDash: [5, 5],
        pointRadius: 0,
        yAxisID: 'y',
      });
    });
  }

  if (chart) chart.destroy();

  const ctx = document.getElementById('myChart').getContext('2d');
  chart = new Chart(ctx, {
    type: 'bar',
    data: { datasets },
    plugins: [crosshairPlugin],
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#1c2128',
          borderColor: '#30363d',
          borderWidth: 1,
          titleColor: '#e6edf3',
          bodyColor: '#8b949e',
          callbacks: {
            label: ctx => {
              if (ctx.parsed.y === null) return null;
              return `${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString()} ${ind.unit}`;
            }
          }
        }
      },
      scales: {
        x: {
          type: 'time',
          time: { tooltipFormat: 'yyyy-MM-dd' },
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#8b949e', maxTicksLimit: 10, font: { size: 10 } }
        },
        y: (() => { const s = calcSmartYRange(data); return {
          min: getYMin() ?? s.min,
          max: getYMax() ?? s.max,
          grid: { color: 'rgba(48,54,61,0.5)' },
          ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v.toLocaleString() },
          title: { display: overlays.length > 0, text: ind.unit, color: '#8b949e', font: { size: 9 } }
        }; })(),
        ...(hasY2 ? { y2: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { color: '#8b949e', font: { size: 10 }, callback: v => v.toLocaleString() },
          title: { display: true, text: hasCotPrice ? '가격' : overlays.filter(o=>o.ind.unit!==ind.unit).map(o=>o.ind.unit).join('/'), color: '#8b949e', font: { size: 9 } }
        }} : {})
      },
      plugins: {
        zoom: {
          zoom: { wheel: { enabled: true, speed: 0.08 }, pinch: { enabled: true }, mode: 'x' },
          pan:  { enabled: true, mode: 'x' },
        }
      }
    }
  });

  // Latest value
  const last = data[data.length - 1];
  if (last) {
    latestValEl.textContent = `${last.y.toLocaleString()} ${ind.unit} (${last.x})`;
  }

  // 차트 선/막대 더블클릭 → 색상 피커
  const canvas = document.getElementById('myChart');
  canvas.ondblclick = (e) => {
    const points = chart.getElementsAtEventForMode(e, 'nearest', { intersect: false }, true);
    if (!points.length) return;
    const dsIndex = points[0].datasetIndex;
    const ds = chart.data.datasets[dsIndex];
    if (!ds) return;

    // overlay 지표인지 확인
    const ovMatch = overlays.find(o => o.ind.name === ds.label);
    const isOverlay = !!ovMatch;
    const color = (typeof ds.borderColor === 'string' ? ds.borderColor : '#58a6ff');
    const hexColor = color.startsWith('#') ? color : '#58a6ff';
    const width = ds.borderWidth || 2;
    const label = ds.label || CHART_DS_LABELS[dsIndex] || '선';

    // 피커 열기 (openPicker는 setupColorPicker 안에 있으므로 직접 구현)
    document.getElementById('pc-label').textContent = label;
    document.getElementById('pc-color').value = hexColor;
    document.getElementById('pc-width').value = width;
    document.getElementById('pc-width-val').textContent = width;

    const picker = document.getElementById('color-picker-popup');
    const PH = 140, PW = 180;
    const rect = canvas.getBoundingClientRect();
    const left = Math.max(4, Math.min(e.clientX, window.innerWidth - PW - 8));
    const top = e.clientY > window.innerHeight * 0.5 ? e.clientY - PH - 8 : e.clientY + 8;
    picker.style.left = left + 'px';
    picker.style.top = Math.max(4, top) + 'px';
    picker.style.display = 'block';

    // 임시로 타겟 설정 (색상 변경 시 적용될 대상)
    picker._dsIndex = dsIndex;
    picker._isOverlay = isOverlay;
    picker._overlayId = ovMatch?.ind?.id || null;
  };
}

// ─── OVERLAY ──────────────────────────────────────────────────────────────────
async function toggleOverlay(ind) {
  if (!currentIndicator) return;
  if (ind.id === currentIndicator.id) return; // 현재 주 지표는 overlay 불가

  const existing = overlays.findIndex(o => o.ind.id === ind.id);
  if (existing !== -1) {
    overlays.splice(existing, 1);
  } else {
    const color = OVERLAY_COLORS[overlays.length % OVERLAY_COLORS.length];
    const dot = document.getElementById(`dot-${ind.id}`);
    if (dot) dot.className = 'status-dot loading';
    try {
      const raw = ind.source === 'tsa' ? await fetchTSA() : await fetchFRED(ind.id, ind.freq);
      overlays.push({ ind, raw, color });
      if (dot) dot.className = 'status-dot loaded';
    } catch(e) {
      if (dot) dot.className = 'status-dot error';
      return;
    }
  }
  updateOverlayBtns();
  renderOverlayChips();
  if (currentRawData) {
    const data = applyTransform(currentRawData, currentMode);
    renderChart(data, currentIndicator);
  }
}

function updateOverlayBtns() {
  document.querySelectorAll('.overlay-btn').forEach(btn => {
    const id = btn.id.replace('ovbtn-', '');
    const isOverlaid = overlays.some(o => o.ind.id === id);
    btn.classList.toggle('active-overlay', isOverlaid);
    btn.textContent = isOverlaid ? '✕' : '＋';
    const item = btn.closest('.indicator-item');
    if (item) item.classList.toggle('overlaid', isOverlaid);
  });
}

function renderOverlayChips() {
  const el = document.getElementById('overlay-chips');
  el.innerHTML = overlays.map(o => `
    <div class="overlay-chip">
      <div class="overlay-chip-dot" style="background:${o.color}"></div>
      <span>${o.ind.name}</span>
      <button class="overlay-chip-x" data-id="${o.ind.id}">✕</button>
    </div>
  `).join('');
  el.querySelectorAll('.overlay-chip-x').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      overlays = overlays.filter(o => o.ind.id !== id);
      updateOverlayBtns();
      renderOverlayChips();
      if (currentRawData) renderChart(applyTransform(currentRawData, currentMode, currentIndicator), currentIndicator);
    });
  });
}

// ─── SELECT INDICATOR ─────────────────────────────────────────────────────────
async function selectIndicator(ind) {
  currentIndicator = ind;

  // Sidebar active
  document.querySelectorAll('.indicator-item').forEach(el => el.classList.remove('active'));
  const activeEl = document.querySelector(`.indicator-item[data-id="${ind.id}"]`);
  if (activeEl) activeEl.classList.add('active');

  // Header
  chartTitle.textContent = ind.name;
  chartSubtitle.textContent = `${ind.id} · ${ind.unit} · Source: FRED`;

  // Show loading
  loadingEl.style.display = 'flex';
  errorEl.style.display = 'none';

  const dot = document.getElementById(`dot-${ind.id}`);
  if (dot) { dot.className = 'status-dot loading'; }

  try {
    if (ind.source === 'price' || ind.source === 'ratio' || ind.source === 'cnn') {
      // 가격 / 비율 / CNN 차트 — 라인 + 이동평균선
      const px = ind.source === 'ratio'
        ? await fetchRatio(ind.yf, ind.yfDenom, 'max')
        : ind.source === 'cnn'
        ? await fetchCNN(ind.cnnKey)
        : await fetchYahooWeekly(ind.yf, 'max');
      currentCotRaw = null; currentCotPrice = null;
      currentRawData = px;
      currentMode = 'raw';
      renderChart(px, ind);
      renderStatBoxes(null, ind);
      updateCotBar(ind);
    } else if (ind.source === 'cot') {
      // COT: 원본 받아서 카테고리별 순포지션 변환 + 가격 동시 로딩
      const rows = await fetchCOT(ind.cotName);
      currentCotRaw = rows;
      currentCotPrice = null;
      currentMode = 'raw';
      // 가격 (실패해도 순포지션은 표시)
      if (ind.yf) {
        try { currentCotPrice = await fetchYahooWeekly(ind.yf, 'max'); } catch(e) { currentCotPrice = null; }
      }
      renderCotCurrent();           // 현재 카테고리 + 뷰(순포지션/Index)로 렌더
      renderStatBoxes(null, ind);   // COT은 YoY/MoM 박스 대신 토글 사용
    } else {
      const raw = ind.source === 'tsa' ? await fetchTSA() : await fetchFRED(ind.id, ind.freq);
      currentCotRaw = null;
      currentCotPrice = null;
      currentRawData = raw;
      currentMode = defaultMode(ind);
      const data = applyTransform(raw, currentMode, ind);
      renderChart(data, ind);
      renderStatBoxes(calcStats(raw, ind), ind);
    }
    updateCotBar(ind);
    // Reset y-range inputs on new indicator
    document.getElementById('ymin-input').value = '';
    document.getElementById('ymax-input').value = '';
    showYRangeBar();
    loadingEl.style.display = 'none';
    if (dot) dot.className = 'status-dot loaded';
    lastUpdatedEl.textContent = `업데이트: ${new Date().toLocaleTimeString('ko-KR')}`;
  } catch (err) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'flex';
    errDetailEl.textContent = err.message;
    if (dot) dot.className = 'status-dot error';
    console.error(err);
  }
}

// ─── SMART Y RANGE ────────────────────────────────────────────────────────────
function calcSmartYRange(data) {
  const vals = data.filter(p => p.y !== null && !isNaN(p.y)).map(p => p.y);
  if (vals.length === 0) return { min: undefined, max: undefined };
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min;
  if (range === 0) return { min: undefined, max: undefined };
  // 데이터가 양수이고 범위가 좁게 뭉쳐 있을 때 (경제활동참가율 등)
  if (min > 0 && min > max * 0.55 && range / max < 0.3) {
    const pad = range * 0.6;
    return { min: Math.max(0, +(min - pad).toFixed(2)), max: +(max + pad).toFixed(2) };
  }
  return { min: undefined, max: undefined };
}

(function setupColorPicker() {

      : rect.bottom + 8;

    const w = parseFloat(document.getElementById('pc-width').value);

  });

  function applyPickerChange(color, width) {
    if (!chart) return;
    // 차트 더블클릭으로 열린 경우 (_dsIndex 사용)
    const pickerEl = document.getElementById('color-picker-popup');
    const activeDsIndex  = pickerEl._dsIndex  !== undefined ? pickerEl._dsIndex  : targetDsIndex;
    const activeIsOverlay= pickerEl._isOverlay !== undefined ? pickerEl._isOverlay : targetIsOverlay;
    const activeOverlayId= pickerEl._overlayId !== undefined ? pickerEl._overlayId : targetOverlayId;

    if (activeIsOverlay) {

// ─── Y축 휠 줌 (마우스가 좌측 Y축 영역에 있을 때) ─────────────────────────────
(function setupYAxisZoom() {
  const canvas = document.getElementById('myChart');
  canvas.addEventListener('wheel', (e) => {
    if (!chart || !chart.chartArea) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    // Y축(왼쪽 눈금) 영역에서만 동작 — plot 영역은 plugin이 x줌 처리
    if (x >= chart.chartArea.left) return;
    e.preventDefault();
    e.stopPropagation();
    const y = e.clientY - rect.top;
    const sc = chart.scales.y;
    if (!sc) return;
    const val = sc.getValueForPixel(y);
    const min = sc.min, max = sc.max;
    const f = e.deltaY < 0 ? 0.85 : 1.18;   // 위로=확대, 아래로=축소
    sc.options.min = val - (val - min) * f;
    sc.options.max = val + (max - val) * f;
    chart.update('none');
  }, { capture: true, passive: false });
})();

// 결정적 난수 (모양 확인용 샘플 데이터)
function supMulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

let SUP_DATA = null;
function supBuildData(){
  if (SUP_DATA) return SUP_DATA;
  const rnd = supMulberry32(20260610);
  const gauss = () => { let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); };
  const days = [];
  let d = new Date(2026, 5, 10);   // 2026-06-10 (오늘)
  while (days.length < 130) {
    const wd = d.getDay();
    if (wd !== 0 && wd !== 6) {
      const v = {};
      SUP_SEGS.forEach(seg => {
        const frn  = Math.round(gauss() * SUP_STD[seg.key]);
        const inst = Math.round(gauss() * SUP_STD[seg.key]);
        v[seg.key] = { frn, inst, ind: -(frn + inst) };  // 개인 = 외인+기관 반대편
      });
      days.push({ date: new Date(d), v });
    }
    d.setDate(d.getDate() - 1);
  }
  days.reverse();   // 오래된 → 최신
  SUP_DATA = days;
  return days;
}

function supFmtDate(dt){ const m=String(dt.getMonth()+1).padStart(2,'0'), day=String(dt.getDate()).padStart(2,'0'); return `${m}/${day}`; }
function supDateKey(dt){ const y=dt.getFullYear(), m=String(dt.getMonth()+1).padStart(2,'0'), d=String(dt.getDate()).padStart(2,'0'); return `${y}-${m}-${d}`; }
function supCls(n){ return n>0?'sup-pos':n<0?'sup-neg':'sup-zero'; }
function supNum(n){ n=Math.round(n); return (n>0?'+':'')+n.toLocaleString(); }

function supGetChecks(){ try { return JSON.parse(localStorage.getItem('supplyChecks')||'{}'); } catch(e){ return {}; } }
function supToggleChk(key, on){ const c=supGetChecks(); if(on) c[key]=true; else delete c[key]; localStorage.setItem('supplyChecks', JSON.stringify(c)); }

function supHeaderRows(firstLabel, lastLabel){
  let h1 = `<tr><th class="${firstLabel==='날짜'?'date-col':'win-col'}" rowspan="2">${firstLabel}</th>`;
  SUP_SEGS.forEach(seg => { h1 += `<th class="${seg.cls} grp-sep" colspan="3">${seg.label}</th>`; });
  h1 += lastLabel ? `<th class="date-col grp-sep" rowspan="2">${lastLabel}</th></tr>` : `</tr>`;
  let h2 = `<tr>`;
  SUP_SEGS.forEach(seg => SUP_INV.forEach((inv,i) => { h2 += `<th class="${i===0?'grp-sep':''}">${inv.label}</th>`; }));
  h2 += `</tr>`;
  return `<thead>${h1}${h2}</thead>`;
}

function supInRange(key, from, to){ return (!from || key >= from) && (!to || key <= to); }

function supRenderToday(){
  const days = supBuildData();
  const checks = supGetChecks();
  const from = document.getElementById('today-from').value;
  const to   = document.getElementById('today-to').value;
  const rows = days.filter(d => supInRange(supDateKey(d.date), from, to)).reverse();   // 최신이 위로
  if (!rows.length) { document.getElementById('sup-today-table').innerHTML = '<p class="sup-note">선택한 범위에 데이터가 없어요.</p>'; return; }
  let body = '';
  rows.forEach(day => {
    const key = supDateKey(day.date);
    body += `<tr><td class="date-col">${supFmtDate(day.date)}</td>`;
    SUP_SEGS.forEach(seg => SUP_INV.forEach((inv,i) => {
      const n = day.v[seg.key][inv.key];
      body += `<td class="${supCls(n)} ${i===0?'grp-sep':''}">${supNum(n)}</td>`;
    }));
    body += `<td class="chk-col grp-sep"><input type="checkbox" class="sup-chk" ${checks[key]?'checked':''} onchange="supToggleChk('${key}', this.checked)"></td></tr>`;
  });
  document.getElementById('sup-today-table').innerHTML =
    `<table class="sup-table">${supHeaderRows('날짜','확인')}<tbody>${body}</tbody></table>`;
}

// 기준일(refIdx)의 segKey/invKey 순매수가 직전 W일 평균 대비 몇 σ인가
function supZ(refIdx, days, segKey, invKey, W){
  const slice = days.slice(0, refIdx).slice(-W);   // 기준일 이전 W일
  if (slice.length < 2) return null;
  const arr = slice.map(d => d.v[segKey][invKey]);
  const mean = arr.reduce((a,b)=>a+b,0)/arr.length;
  const sd = Math.sqrt(arr.reduce((a,b)=>a+(b-mean)*(b-mean),0)/arr.length) || 1;
  return (days[refIdx].v[segKey][invKey] - mean) / sd;
}
// σ → 히트맵 셀 (색 진할수록 강함)
function supHeat(z, sep){
  if (z === null) return `<td class="sup-zero ${sep}">—</td>`;
  const a = Math.min(Math.abs(z)/3, 0.85);
  const bg = z>0 ? `rgba(63,185,80,${a.toFixed(2)})` : z<0 ? `rgba(248,81,73,${a.toFixed(2)})` : 'transparent';
  const bold = Math.abs(z) >= 2 ? 'font-weight:700;' : '';
  return `<td class="${sep}" style="background:${bg};color:#e6edf3;${bold}">${(z>0?'+':'')+z.toFixed(1)}</td>`;
}

let supSigmaWin = 20;
function supSetSigmaWin(w){ supSigmaWin = w; supRenderSigma(); }

// 하루 상세: 행=5/20/60/120, 열=12 (히트맵)
function supSigmaDetail(refIdx, days){
  let body = '';
  [5,20,60,120].forEach(W => {
    body += `<tr><td class="win-col">${W}일</td>`;
    SUP_SEGS.forEach(seg => SUP_INV.forEach((inv,i) => { body += supHeat(supZ(refIdx,days,seg.key,inv.key,W), i===0?'grp-sep':''); }));
    body += `</tr>`;
  });
  return `<table class="sup-table">${supHeaderRows('기준','')}<tbody>${body}</tbody></table>`;
}

// 여러 날 압축: 행=날짜, 열=12 (선택 윈도우 한 개, 히트맵)
function supSigmaCompact(idxs, days){
  const btns = [5,20,60,120].map(w => `<button class="sup-mini ${w===supSigmaWin?'active':''}" onclick="supSetSigmaWin(${w})">${w}일</button>`).join(' ');
  let body = '';
  idxs.forEach(idx => {
    body += `<tr><td class="date-col">${supFmtDate(days[idx].date)}</td>`;
    SUP_SEGS.forEach(seg => SUP_INV.forEach((inv,i) => { body += supHeat(supZ(idx,days,seg.key,inv.key,supSigmaWin), i===0?'grp-sep':''); }));
    body += `</tr>`;
  });
  return `<div class="sup-range">기준 윈도우: ${btns}</div>` +
    `<table class="sup-table">${supHeaderRows('날짜','')}<tbody>${body}</tbody></table>`;
}

function supRenderSigma(){
  const days = supBuildData();
  const from = document.getElementById('sigma-from').value;
  const to   = document.getElementById('sigma-to').value;
  let idxs = days.map((d,i)=>i).filter(i => supInRange(supDateKey(days[i].date), from, to)).reverse();   // 최신이 위로
  const el = document.getElementById('sup-sigma-table');
  if (!idxs.length) { el.innerHTML = '<p class="sup-note">선택한 범위에 데이터가 없어요.</p>'; return; }
  if (idxs.length === 1) {
    el.innerHTML = `<p class="sup-note">📌 <b>${supDateKey(days[idxs[0]].date)}</b> 기준 · 직전 5·20·60·120일 평균 대비 σ · 색 진할수록 강함 (|2σ|↑ 굵게)</p>` +
      supSigmaDetail(idxs[0], days);
  } else {
    const capped = idxs.slice(0, 60);
    let html = `<p class="sup-note">기간 σ 히트맵 · 한 줄=하루 · 색 진할수록 강함 (|2σ|↑ 굵게)</p>` + supSigmaCompact(capped, days);
    if (idxs.length > 60) html += `<p class="sup-note">…범위가 넓어 최근 60일만 표시</p>`;
    el.innerHTML = html;
  }
}

let supInited = false;
function supInitControls(){
  const days = supBuildData();
  const minK = supDateKey(days[0].date), maxK = supDateKey(days[days.length-1].date);
  const tf=document.getElementById('today-from'), tt=document.getElementById('today-to');
  const sf=document.getElementById('sigma-from'), st=document.getElementById('sigma-to');
  const def20 = supDateKey(days[Math.max(0, days.length-20)].date);
  [tf,tt,sf,st].forEach(el => { el.min=minK; el.max=maxK; });
  if (!supInited) {
    tt.value=maxK; tf.value=def20;     // 당일수급 기본: 최근 20일
    sf.value=maxK; st.value=maxK;      // 시그마 기본: 오늘 하루
    [tf,tt].forEach(el => el.addEventListener('change', supRenderToday));
    [sf,st].forEach(el => el.addEventListener('change', supRenderSigma));
    document.getElementById('today-reset').addEventListener('click', () => { tt.value=maxK; tf.value=def20; supRenderToday(); });
    document.getElementById('sigma-reset').addEventListener('click', () => { sf.value=maxK; st.value=maxK; supRenderSigma(); });
    supInited = true;
  }
}

function showSupplyPanel(){
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('chart-area').style.display = 'none';
  document.getElementById('legend-area').style.display = 'none';
  document.getElementById('sidebar-scroll').innerHTML =
    '<div style="padding:16px;color:var(--text-muted);font-size:12px;line-height:1.7">💹 <b style="color:var(--text)">수급 탭</b><br>우측 표를 확인하세요.<br><br>· 당일 수급<br>· 수급 시그마</div>';
  supInitControls();
  supRenderToday();
  supRenderSigma();
  document.getElementById('supply-panel').classList.add('show');
}
function hideSupplyPanel(){
  document.getElementById('supply-panel').classList.remove('show');
  document.getElementById('topbar').style.display = '';
  document.getElementById('chart-area').style.display = '';
  document.getElementById('legend-area').style.display = '';
}

document.querySelectorAll('.sup-subtab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.sup-subtab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const v = btn.dataset.sup;
    document.getElementById('sup-view-today').classList.toggle('show', v==='today');
    document.getElementById('sup-view-sigma').classList.toggle('show', v==='sigma');
  });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildSidebar();
loadingEl.style.display = 'none';

if (!apiKey) {
  apiModal.classList.add('show');
} else {
  selectIndicator(INDICATORS[0]);
}
</script>
